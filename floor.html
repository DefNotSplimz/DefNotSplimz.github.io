<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#f8fafc" />
    <meta name="robots" content="noindex, nofollow" />
    <title>DATUM OS // PROTOTYPING</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f8fafc;
        --surface: #ffffff;
        --surface-hover: #f1f5f9;
        --line: #e2e8f0;
        --text-main: #0f172a;
        --text-muted: #64748b;
        --accent: #ea580c;
        --accent-hover: #c2410c;
        --good: #059669;
        --good-bg: #d1fae5;
        --warn: #d97706;
        --warn-bg: #fef3c7;
        --bad: #dc2626;
        --bad-bg: #fee2e2;
        --shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.1), 0 1px 2px -1px rgba(0, 0, 0, 0.1);
        --radius: 8px;
        --font: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      }
      
      * { box-sizing: border-box; margin: 0; padding: 0; font-family: var(--font); }
      html, body { height: 100%; background: var(--bg); color: var(--text-main); -webkit-font-smoothing: antialiased; overflow: hidden; }
      button, input, select, textarea { color: inherit; background: transparent; border: none; outline: none; font-size: 13px; }
      button { cursor: pointer; }
      
      .app { display: grid; grid-template-columns: 240px 1fr; height: 100vh; }
      
      /* Sidebar */
      .rail { background: var(--surface); border-right: 1px solid var(--line); display: flex; flex-direction: column; z-index: 10; }
      .brand { height: 72px; padding: 0 24px; display: flex; align-items: center; font-weight: 800; font-size: 15px; letter-spacing: -0.02em; color: var(--text-main); }
      .brand span { color: var(--accent); margin-right: 4px; }
      .nav { padding: 12px; overflow-y: auto; flex: 1; }
      .nav-group { margin-bottom: 24px; }
      .nav-label { font-size: 10px; font-weight: 700; color: var(--text-muted); padding: 0 12px 8px; text-transform: uppercase; letter-spacing: 0.05em; }
      .nav button { width: 100%; text-align: left; padding: 8px 12px; border-radius: var(--radius); color: var(--text-muted); font-weight: 500; display: flex; gap: 12px; align-items: center; transition: all 0.1s; }
      .nav button:hover { background: var(--surface-hover); color: var(--text-main); }
      .nav button.active { background: var(--surface-hover); color: var(--accent); font-weight: 600; }
      .rail-bottom { border-top: 1px solid var(--line); padding: 16px 24px; font-size: 11px; font-weight: 600; color: var(--text-muted); display: flex; justify-content: space-between; align-items: center; }
      .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--good); }

      /* Main Workspace */
      .main { display: flex; flex-direction: column; min-width: 0; }
      .top { height: 72px; padding: 0 32px; display: flex; justify-content: space-between; align-items: center; background: var(--bg); flex-shrink: 0; }
      .crumb { font-size: 13px; font-weight: 600; color: var(--text-muted); }
      .top-actions { display: flex; gap: 12px; }
      
      .workspace { flex: 1; overflow-y: auto; padding: 0 32px 40px; }
      .page { max-width: 1200px; margin: 0 auto; display: flex; flex-direction: column; gap: 24px; }
      
      .hero { margin-bottom: 8px; }
      .hero .h1 { font-size: 28px; font-weight: 800; letter-spacing: -0.03em; color: var(--text-main); }
      .hero .sub { font-size: 14px; color: var(--text-muted); margin-top: 6px; max-width: 600px; line-height: 1.5; }

      /* Controls & Inputs */
      .btn { padding: 0 16px; height: 36px; border-radius: var(--radius); font-size: 13px; font-weight: 600; display: inline-flex; align-items: center; justify-content: center; transition: all 0.1s; border: 1px solid var(--line); background: var(--surface); color: var(--text-main); box-shadow: var(--shadow); }
      .btn:hover { background: var(--surface-hover); border-color: #cbd5e1; }
      .btn.primary { background: var(--accent); color: white; border: none; box-shadow: 0 1px 2px rgba(234,88,12,0.3); }
      .btn.primary:hover { background: var(--accent-hover); }
      .btn.danger { background: var(--bad-bg); color: var(--bad); border: none; box-shadow: none; }
      .btn.danger:hover { background: #fecaca; }

      .input, select, textarea { width: 100%; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 10px 12px; transition: border 0.1s; box-shadow: var(--shadow); }
      textarea { resize: vertical; min-height: 80px; }
      .input:focus, select:focus, textarea:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px rgba(234,88,12,0.1); }
      .field { display: flex; flex-direction: column; gap: 6px; }
      .field label { font-size: 11px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; }

      /* Cards & Layouts */
      .card { background: var(--surface); border-radius: 12px; box-shadow: var(--shadow); border: 1px solid var(--line); overflow: hidden; }
      .card-body { padding: 24px; }
      .card-header { padding: 20px 24px 0; display: flex; justify-content: space-between; align-items: center; }
      .card-title { font-size: 14px; font-weight: 700; }
      
      .grid { display: grid; gap: 16px; }
      .g2 { grid-template-columns: repeat(2, 1fr); }
      .g3 { grid-template-columns: repeat(3, 1fr); }
      .g4 { grid-template-columns: repeat(4, 1fr); }
      .layout-sidebar { display: grid; grid-template-columns: 1fr 380px; gap: 24px; }

      /* Metrics */
      .metric { padding: 24px; }
      .metric-label { font-size: 11px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; }
      .metric-val { font-size: 32px; font-weight: 800; letter-spacing: -0.02em; margin-top: 8px; color: var(--text-main); }
      .metric-sub { font-size: 12px; color: var(--text-muted); margin-top: 4px; font-weight: 500; }

      /* Tables */
      .table-container { width: 100%; overflow-x: auto; }
      table { width: 100%; border-collapse: collapse; text-align: left; min-width: 700px; }
      th { font-size: 11px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; padding: 12px 24px; border-bottom: 1px solid var(--line); background: #fdfdfd; }
      td { padding: 14px 24px; border-bottom: 1px solid var(--line); font-size: 13px; font-weight: 500; }
      tr:last-child td { border-bottom: none; }
      td input, td select { box-shadow: none; background: transparent; border-color: transparent; padding: 4px 8px; margin: -4px -8px; width: calc(100% + 16px); }
      td input:hover, td select:hover { background: var(--surface-hover); }
      td input:focus, td select:focus { background: var(--surface); border-color: var(--accent); box-shadow: 0 0 0 2px rgba(234,88,12,0.1); }

      /* Utilities */
      .status { display: inline-block; padding: 4px 10px; border-radius: 99px; font-size: 11px; font-weight: 700; letter-spacing: 0.02em; }
      .st-good { background: var(--good-bg); color: var(--good); }
      .st-warn { background: var(--warn-bg); color: var(--warn); }
      .st-bad { background: var(--bad-bg); color: var(--bad); }
      .st-neutral { background: var(--surface-hover); color: var(--text-muted); }
      .text-accent { color: var(--accent); }
      .toolbar { display: flex; gap: 12px; align-items: flex-end; padding: 20px 24px; border-bottom: 1px solid var(--line); background: #fdfdfd; }
      
      .tabs { display: flex; gap: 8px; border-bottom: 1px solid var(--line); margin-bottom: 24px; }
      .tabs button { padding: 10px 16px; font-size: 13px; font-weight: 600; color: var(--text-muted); border-bottom: 2px solid transparent; margin-bottom: -1px; }
      .tabs button.active { color: var(--accent); border-bottom-color: var(--accent); }
      .tabs button:hover:not(.active) { color: var(--text-main); }

      .list-row { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); margin-bottom: 8px; }
      
      .toast { position: fixed; right: 32px; bottom: 32px; background: var(--text-main); color: white; padding: 12px 20px; border-radius: var(--radius); font-size: 13px; font-weight: 500; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); z-index: 100; }
      
      .modal-bg { position: fixed; inset: 0; background: rgba(15, 23, 42, 0.4); backdrop-filter: blur(2px); display: grid; place-items: center; z-index: 50; padding: 24px; }
      .modal { background: var(--surface); width: min(800px, 100%); border-radius: 12px; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1); overflow: hidden; display: flex; flex-direction: column; max-height: 90vh; }
      .modal-head { padding: 20px 24px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; font-weight: 700; font-size: 15px; }
      .modal-body { padding: 24px; overflow-y: auto; }
      .modal-close { font-size: 20px; color: var(--text-muted); }
      .modal-close:hover { color: var(--text-main); }

      @media (max-width: 900px) {
        .app { grid-template-columns: 1fr; }
        .rail { display: none; }
        .layout-sidebar { grid-template-columns: 1fr; }
      }

      /* PRINT ISO */
      @media print {
        @page { size: A4 portrait; margin: 10mm; }
        * { background: transparent !important; color: #000 !important; box-shadow: none !important; }
        .rail, .top, .btn, .tabs, .modal-bg, .toast { display: none !important; }
        .app, .main, .workspace, .page { display: block !important; height: auto !important; margin: 0 !important; padding: 0 !important; max-width: 100% !important; }
        .card { border: none !important; border-radius: 0 !important; margin-bottom: 20px !important; page-break-inside: avoid; }
        .layout-sidebar { display: block !important; }
        .layout-sidebar > * { display: block !important; margin-bottom: 20px !important; }
        .hero { border-bottom: 2px solid #000; padding-bottom: 10px; margin-bottom: 20px; }
        .hero::before { content: 'DATUM // ENGINEERING & INSPECTION RECORD'; display: block; font-size: 8pt; font-weight: bold; margin-bottom: 5px; }
        table { border-collapse: collapse !important; border: 1px solid #000 !important; }
        th, td { border: 1px solid #000 !important; padding: 6px 8px !important; font-size: 9pt !important; }
        th { font-weight: bold !important; border-bottom: 2px solid #000 !important; }
        input, textarea, select { display: block !important; width: 100% !important; border: none !important; font-family: monospace !important; font-size: 10pt !important; padding: 0 !important; }
        .status { border: 1px solid #000 !important; }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <aside class="rail">
        <div class="brand"><span>D</span> DATUM OS</div>
        <nav class="nav" id="nav"></nav>
        <div class="rail-bottom">
          <span>LOCAL STORE</span><span class="dot"></span>
        </div>
      </aside>
      
      <main class="main">
        <header class="top">
          <div class="crumb" id="crumb">PROJECTS / OVERVIEW</div>
          <div class="top-actions">
            <button class="btn" onclick="downloadJSON(store,'datum-os-backup.json')">Backup JSON</button>
            <input id="importInput" type="file" accept="application/json" hidden />
            <button class="btn primary" onclick="newJobModal()">+ New Project</button>
          </div>
        </header>
        
        <section class="workspace"><div id="page" class="page"></div></section>
      </main>
    </div>
    
    <div id="modalRoot"></div>
    <div id="toastRoot"></div>

    <script>
      "use strict";
      // Version bumpet til v6 for at overskrive eventuelt korrupt lokalt data
      const DBKEY = "datum_prototyping_os_v6";
      const TODAY = new Date().toISOString().slice(0, 10);
      
      const MATERIALS = {
        alu_6082: { name: "ALU 6082 / 6060", group: "ALUMINUM", vc: 350, f: 0.08 },
        alu_7075: { name: "ALU 7075", group: "ALUMINUM", vc: 450, f: 0.1 },
        s235: { name: "S235", group: "STEEL", vc: 160, f: 0.06 },
        s355: { name: "S355", group: "STEEL", vc: 120, f: 0.05 },
        ss304: { name: "304 / 316", group: "STAINLESS", vc: 80, f: 0.04 },
        brass: { name: "BRASS", group: "BRASS", vc: 300, f: 0.08 },
        pom: { name: "POM / DELRIN", group: "PLASTIC", vc: 400, f: 0.15 },
        toolsteel: { name: "TOOL STEEL <45 HRC", group: "TOOL STEEL", vc: 90, f: 0.04 },
      };

      const HARDNESS_MODIFIERS = {
        soft: { name: "Soft / Annealed", mult: 1.15 },
        standard: { name: "Standard Condition", mult: 1.0 },
        hard: { name: "Hardened / Tough", mult: 0.8 },
      };

      const STANDARD_DRILLS = [1.0, 1.5, 2.0, 2.5, 3.0, 3.3, 3.5, 4.0, 4.2, 4.5, 5.0, 5.5, 6.0, 6.5, 6.8, 7.0, 7.5, 8.0, 8.5, 9.0, 9.5, 10.0, 10.2, 10.5, 11.0, 11.5, 12.0];
      function getStandardDrill(targetSize) {
        return STANDARD_DRILLS.reduce((prev, curr) => Math.abs(curr - targetSize) < Math.abs(prev - targetSize) ? curr : prev);
      }

      const TOOL_BASE = {
        mill: { hss: { name: "HSS-Co", vc: 0.4, f: 0.7, z: 3 }, hm: { name: "CARBIDE UNCOATED", vc: 1, f: 1, z: 4 }, hm_coat: { name: "CARBIDE COATED", vc: 1.3, f: 1.1, z: 4 } },
        turn: { hss: { name: "HSS TURN", vc: 0.4, f: 0.7 }, iso: { name: "ISO INSERT", vc: 1, f: 1 } },
      };
      
      const MACHINES = {
        deckel: { name: "Deckel FP1", type: "mill", rpm: 2000 },
        hsm: { name: "Haas Mini Mill", type: "mill", rpm: 10000 },
        weiler: { name: "Weiler Matador", type: "turn", rpm: 3000 },
        st10: { name: "Haas ST-10", type: "turn", rpm: 4000 },
      };
      
      const GEOM = [
        ["MILLING", [["endmill", "ENDMILL"], ["bullnose", "BULLNOSE"], ["ballnose", "BALLNOSE"], ["facemill", "FACEMILL"], ["chamfer", "CHAMFER"], ["threadmill", "THREADMILL"]]],
        ["HOLEMAKING", [["drill", "DRILL"], ["spotdrill", "SPOT DRILL"], ["tap", "TAP"]]],
        ["TURNING", [["turn_ext", "OD TURN"], ["turn_int", "ID TURN"], ["turn_groove", "GROOVE"], ["turn_thread", "THREAD"]]],
      ];

      const ISO = {
        ranges: [3, 6, 10, 18, 30, 50, 80, 120, 180, 250],
        classes: {
          H7: [[10, 0], [12, 0], [15, 0], [18, 0], [21, 0], [25, 0], [30, 0], [35, 0], [40, 0], [46, 0]],
          h7: [[0, -10], [0, -12], [0, -15], [0, -18], [0, -21], [0, -25], [0, -30], [0, -35], [0, -40], [0, -46]],
        },
      };

      const navGroups = [
        ["WORKSPACE", [["dashboard", "OVERVIEW"], ["projects", "PROJECT LOG"]]],
        ["ENGINEERING", [["setup", "SETUP BUILDER"], ["cut", "SPEEDS & FEEDS"], ["calc", "CALCULATORS"]]],
        ["QUALITY", [["qc", "INSPECTION & FAI"]]],
        ["SYSTEM", [["tools", "TOOL CRIB"], ["machines", "MACHINES"], ["settings", "SETTINGS"]]],
      ];

      const $ = (s) => document.querySelector(s), $$ = (s) => [...document.querySelectorAll(s)];
      function esc(v) { return String(v ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]); }
      function uid(prefix) { return prefix + "-" + Math.random().toString(36).slice(2, 7).toUpperCase(); }
      function toast(t) { const r = $("#toastRoot"); r.innerHTML = `<div class="toast">${esc(t)}</div>`; setTimeout(() => (r.innerHTML = ""), 2600); }

      function defaultJob(overrides = {}) {
        return { id: uid("PRJ"), part: "New Project", status: "ACTIVE", machine: MACHINES.hsm.name, material: "alu_6082", notes: "", ...overrides };
      }
      
      function seed() {
        return {
          version: 6, active: "dashboard",
          jobs: [defaultJob({ id: "PRJ-ALPHA", part: "Prototype Enclosure v1", material: "alu_7075" })],
          tools: [{ id: "T-1", loc: "T1", name: "Ø10 Endmill", type: "endmill", mat: "hm", D: 10, Z: 4, L: 30, notes: "Roughing" }],
          setups: [], measurements: [],
          draft: { part: "New Project", material: "alu_7075", machine: "hsm" },
          sf: { machine: "hsm", mat: "alu_7075", hardness: "standard", strategy: "normal", tool: "hm" }, measureDraft: {}
        };
      }

      let store = loadStore();
      
      function loadStore() {
        try { const x = JSON.parse(localStorage.getItem(DBKEY) || "null"); return x && x.version === 6 ? hydrate(x) : seed(); } 
        catch { return seed(); }
      }
      
      function hydrate(x) { 
        const s = seed(); 
        return { ...s, ...x, jobs: x.jobs || s.jobs, tools: x.tools || [], setups: x.setups || [], measurements: x.measurements || [], draft: { ...s.draft, ...(x.draft || {}) }, sf: { ...s.sf, ...(x.sf || {}) }, measureDraft: { ...s.measureDraft, ...(x.measureDraft || {}) } }; 
      }
      
      function save() { try { localStorage.setItem(DBKEY, JSON.stringify(store)); return true; } catch (e) { toast("Failed to save data"); return false; } }

      function deleteJob(id) {
        if (!confirm("Delete project " + id + " and all associated history?")) return;
        store.jobs = store.jobs.filter((j) => j.id !== id);
        store.setups = store.setups.filter((s) => s.jobId !== id);
        store.measurements = store.measurements.filter((m) => m.jobId !== id);
        if (store.draft.jobId === id) store.draft.jobId = null;
        if (store.measureDraft.jobId === id) store.measureDraft.jobId = null;
        save(); closeModal(); render(); toast("Project deleted");
      }

      function deleteMeasurement(id) { store.measurements = store.measurements.filter((m) => m.id !== id); save(); render(); }
      function deleteTool(id) {
        if (store.setups.some((s) => s.tools?.includes(id))) return toast("Tool is locked to a setup");
        store.tools = store.tools.filter((t) => t.id !== id); save(); render();
      }

      function navRender() {
        let h = "";
        for (const [g, items] of navGroups) {
          h += `<div class="nav-group"><div class="nav-label">${g}</div>${items.map(([id, label]) => `<button class="${store.active === id ? "active" : ""}" data-nav="${id}">${label}</button>`).join("")}</div>`;
        }
        $("#nav").innerHTML = h;
        $$("[data-nav]").forEach((b) => {
          b.onclick = () => { store.active = b.dataset.nav; save(); render(); };
        });
      }

      function basePage(eyebrow, h1, sub, actions = "") {
        return `
          <div class="hero">
            <div class="eyebrow">${eyebrow}</div>
            <div style="display:flex; justify-content:space-between; align-items:flex-end;">
              <div class="h1">${h1}</div>
              <div class="actions print-hide">${actions}</div>
            </div>
            <div class="sub">${sub}</div>
          </div>`;
      }

      function render() {
        document.title = "DATUM OS // PROTOTYPING";
        $("#crumb").textContent = store.active.replace(/_/g, " ").toUpperCase();
        navRender();
        const map = { dashboard, projects, setup, cut, calc, qc, tools, machines, settings };
        $("#page").innerHTML = (map[store.active] || dashboard)();
        bind();
      }

      function jobBy(id) { return store.jobs.find((j) => j.id === id); }
      function jobOptions(selected = "") { return store.jobs.map((j) => `<option value="${esc(j.id)}" ${j.id === selected ? "selected" : ""}>${esc(j.part)}</option>`).join(""); }

      // VIEWS
      function dashboard() {
        const active = store.jobs.filter((j) => j.status === "ACTIVE").length;
        const pass = store.measurements.filter((x) => x.ok).length;
        const totalM = store.measurements.length;
        return basePage("WORKSPACE", "Overview", "Precision environment for high-accuracy machining and dimensional control.", `<button class="btn primary" onclick="store.active='projects';save();render()">Open Log</button>`) + `
          <div class="grid g4">
            <div class="card metric"><div class="metric-label">Active Projects</div><div class="metric-val">${active}</div></div>
            <div class="card metric"><div class="metric-label">Pass Yield</div><div class="metric-val text-accent">${totalM ? Math.round((pass/totalM)*100) : 0}%</div></div>
            <div class="card metric"><div class="metric-label">Registered Tools</div><div class="metric-val">${store.tools.length}</div></div>
            <div class="card metric"><div class="metric-label">Saved Setups</div><div class="metric-val">${store.setups.length}</div></div>
          </div>`;
      }

      function projects() {
        const tableBody = store.jobs.map((j) => `
          <tr>
            <td><strong>${esc(j.id)}</strong></td>
            <td>${esc(j.part)}</td>
            <td>${esc(j.machine)}</td>
            <td>${esc(MATERIALS[j.material]?.name || j.material)}</td>
            <td><span class="status ${j.status === 'ACTIVE' ? 'st-good' : 'st-neutral'}">${esc(j.status)}</span></td>
            <td>${esc(j.notes)}</td>
            <td style="text-align:right;"><button class="btn" onclick="openJob('${esc(j.id)}')">Manage</button></td>
          </tr>`).join("") || `<tr><td colspan="7" style="text-align:center; padding: 32px; color: var(--text-muted);">No projects created yet.</td></tr>`;

        return basePage("WORKSPACE", "Project Log", "Documentation of assignments. Link your setups and measurements directly here.", `<button class="btn primary" onclick="newJobModal()">+ New Project</button>`) + `
          <div class="card"><div class="table-container"><table><thead><tr><th>ID</th><th>Part</th><th>Machine</th><th>Material</th><th>Status</th><th>Notes</th><th></th></tr></thead><tbody>${tableBody}</tbody></table></div></div>`;
      }

      function newJobModal() {
        const machOpts = Object.entries(MACHINES).map(([k, m]) => `<option value="${k}">${m.name}</option>`).join("");
        const matOpts = Object.entries(MATERIALS).map(([k, m]) => `<option value="${k}">${m.name}</option>`).join("");
        
        modal("New Project", `
          <div class="grid g2">
            <div class="field"><label>Part Name</label><input class="input" id="mPart" value="New Project"></div>
            <div class="field"><label>Machine</label><select id="mMachine">${machOpts}</select></div>
            <div class="field"><label>Material</label><select id="mMat">${matOpts}</select></div>
            <div class="field"><label>Notes</label><input class="input" id="mNotes" placeholder="Optional"></div>
          </div>
          <div style="margin-top: 24px; display:flex; justify-content:flex-end;">
            <button class="btn primary" onclick="createJob()">Create Project</button>
          </div>
        `);
      }

      function createJob() {
        const machineKey = $("#mMachine").value;
        const j = defaultJob({ part: $("#mPart").value.trim() || "Part", machine: MACHINES[machineKey].name, material: $("#mMat").value, notes: $("#mNotes").value });
        store.jobs.unshift(j);
        save(); closeModal(); render(); toast("Project created");

      function calcSF() {
        const machineKey = $("#sfMachine").value;
        const m = MACHINES[machineKey] || MACHINES.hsm;
        const mat = MATERIALS[$("#sfMat").value] || MATERIALS.alu_6082;
        const hardKey = $("#sfHard").value || "standard";
        const hardMod = HARDNESS_MODIFIERS[hardKey]?.mult || 1.0;
        const isTurn = m.type === "turn";
        
        const tk = $("#sfTool").value;
        let tool;
        if (tk.startsWith("crib:")) {
          const cribTool = store.tools.find(t => t.id === tk.slice(5));
          tool = cribTool ? { vc: 1, f: 1, z: cribTool.Z || 4 } : { vc: 1, f: 1, z: 4 };
        } else {
          tool = isTurn ? TOOL_BASE.turn[tk] : TOOL_BASE.mill[tk];
        }
        if (!tool) tool = { vc: 1, f: 1, z: 4 }; // Safe fallback
        
        const D = Math.max(0.001, +$("#sfD").value || 0), Z = Math.max(1, +$("#sfZ").value || 4), L = +$("#sfL").value || 0, ae = Math.max(0, +$("#sfAe").value || 0), ap = Math.max(0, +$("#sfAp").value || 0);
        const strategy = { normal: [1, 1], skrub: [0.85, 1.25], slet: [1.2, 0.6] }[$("#sfStrategy").value] || [1, 1];
        
        let vc = mat.vc * tool.vc * strategy[0] * hardMod;
        let rpmIdeal = (vc * 1000) / (Math.PI * D);
        let rpm = Math.min(rpmIdeal, m.rpm);
        let feedPerRev = mat.f * tool.f * strategy[1] * Math.sqrt(hardMod);
        
        let vf = 0, mrr = 0, ld = isTurn ? 0 : L / D;
        let flags = [];

        if (isTurn) {
          vf = feedPerRev;
          mrr = ap * vf * vc;
          if (ap <= 0) flags.push("Axial depth (ap) missing.");
        } else {
          if (ae > 0 && ae < D / 2) feedPerRev *= Math.min(Math.sqrt(D / ae), 3);
          vf = rpm * Z * feedPerRev;
          mrr = (ap * ae * vf) / 1000;
          if (ld >= 4) flags.push(`HIGH L/D RISK: ${ld.toFixed(1)}x - Watch for deflection.`);
          if (!ae || !ap) flags.push("Set ae/ap to calculate MRR.");
        }
        if (rpmIdeal > m.rpm) flags.push(`Spindle capped at machine max (${m.rpm} RPM).`);

        $("#sfRpm").textContent = Math.round(rpm); 
        $("#sfVf").textContent = isTurn ? vf.toFixed(3) : Math.round(vf);
        $("#sfVc").textContent = Math.round(vc);
        $("#sfFz").textContent = feedPerRev.toFixed(3);
        $("#sfMrr").textContent = mrr.toFixed(1);
        $("#sfLd").textContent = isTurn ? "N/A" : ld.toFixed(1);
        
        $("#sfVfUnit").textContent = isTurn ? "mm/rev" : "mm/min";
        $("#sfFzUnit").textContent = isTurn ? "mm/rev" : "mm/tooth";

        $("#sfFlags").innerHTML = flags.length ? flags.map(f => `<div class="status st-warn" style="margin-bottom:4px; display:block; text-align:center;">${esc(f)}</div>`).join('') : '<div class="status st-good" style="display:block; text-align:center;">Parameters Optimal</div>';

        store.sf = { machine: machineKey, mat: $("#sfMat").value, tool: tk, strategy: $("#sfStrategy").value, hardness: hardKey }; save();
      }
      
      function copySF() { navigator.clipboard?.writeText(`S${$("#sfRpm").textContent} F${$("#sfVf").textContent} (Vc: ${$("#sfVc").textContent} m/min | fz: ${$("#sfFz").textContent})`); toast("Data copied"); }

      function calcThreadHtml() { return `<div class="layout-sidebar"><div class="card card-body grid g2"><div class="field"><label>Nominal Ø</label><input class="input" id="thrD" type="number" value="8" oninput="doThread()"></div><div class="field"><label>Pitch P</label><input class="input" id="thrP" type="number" value="1.25" oninput="doThread()"></div></div><div class="grid"><div class="card metric"><div class="metric-label">Standard Cut Tap Drill</div><div class="metric-val text-accent" id="thrCut">—</div></div><div class="card metric"><div class="metric-label">Form Tap Drill</div><div class="metric-val" id="thrForm">—</div></div></div></div>`; }
      function simpleCalc(type) {
        if (type === "chamfer") return `<div class="layout-sidebar"><div class="card card-body grid g2"><div class="field"><label>Chamfer Width (mm)</label><input class="input" id="fc" type="number" value="2.5" oninput="doChamfer()"></div><div class="field"><label>Tool Angle</label><select id="fa" onchange="doChamfer()"><option value="90">90°</option><option value="60">60°</option><option value="120">120°</option></select></div></div><div class="card metric"><div class="metric-label">Required Z-Depth</div><div class="metric-val" id="fz">—</div></div></div>`;
        return `<div class="layout-sidebar"><div class="card card-body grid g2"><div class="field"><label>Angle A</label><input class="input" id="ta" type="number" value="30" oninput="doTri()"></div><div class="field"><label>Opposite Side a</label><input class="input" id="tsa" type="number" value="50" oninput="doTri()"></div><div class="field"><label>Adjacent Side b</label><input class="input" id="tsb" type="number" value="25" oninput="doTri()"></div></div><div class="grid"><div class="card metric"><div class="metric-label">Hypotenuse c</div><div class="metric-val" id="tc">—</div></div><div class="card metric"><div class="metric-label">Angle B</div><div class="metric-val" id="tb">—</div></div></div></div>`;
      }
      
      function doIso() { const d = +$("#isoD").value || 0, c = ($("#isoClass").value || "").trim(), a = ISO.classes[c]; let i = ISO.ranges.findIndex((x) => d <= x); if (i < 0) i = ISO.ranges.length - 1; const r = a?.[i] ? { lo: a[i][1] / 1000, up: a[i][0] / 1000 } : null; $("#isoMin").textContent = r ? (d + r.lo).toFixed(3) : "—"; $("#isoMax").textContent = r ? (d + r.up).toFixed(3) : "—"; }
      function doThread() { const d = +$("#thrD").value || 0, p = +$("#thrP").value || 0; $("#thrCut").textContent = getStandardDrill(d - p).toFixed(2) + " mm"; $("#thrForm").textContent = getStandardDrill(d - p / 2).toFixed(2) + " mm"; }
      function doChamfer() { const c = +$("#fc").value || 0, a = ((+$("#fa").value || 90) * Math.PI) / 180; $("#fz").textContent = Math.abs(c * Math.tan(a / 2)).toFixed(3) + " mm"; }
      function doTri() { const A = ((+$("#ta").value || 0) * Math.PI) / 180, a = +$("#tsa").value || 0, b = +$("#tsb").value || 0, c = Math.sqrt(Math.max(0, a * a + b * b - 2 * a * b * Math.cos(A))); const B = (Math.acos(Math.min(1, Math.max(-1, (a*a+c*c-b*b)/(2*a*c||1)))) * 180) / Math.PI; $("#tc").textContent = c.toFixed(3); $("#tb").textContent = B.toFixed(3) + "°"; }

        modal("Create Tool", `
          <div class="grid g3">
            <div class="field"><label>Location</label><input class="input" id="tl" value="T${store.tools.length + 1}"></div>
            <div class="field"><label>Name</label><input class="input" id="tn" value="Endmill"></div>
            <div class="field"><label>Geometry</label><select id="tt"><option value="endmill">Endmill</option><option value="drill">Drill</option><option value="tap">Tap</option></select></div>
            <div class="field"><label>Ø D</label><input class="input" id="td" type="number" value="10"></div>
            <div class="field"><label>Flutes Z</label><input class="input" id="tz" type="number" value="4"></div>
            <div class="field"><label>Material</label><select id="tm"><option value="hm">Carbide</option><option value="hss">HSS</option></select></div>
            <div class="field" style="grid-column:1/-1"><label>Note</label><input class="input" id="tNotes"></div>
          </div>
          <div style="margin-top:24px; display:flex; justify-content:flex-end;"><button class="btn primary" onclick="saveTool()">Save Tool</button></div>`);
      }
      function saveTool() { const t = { id: uid("T"), loc: $("#tl").value.trim().toUpperCase(), name: $("#tn").value.trim(), type: $("#tt").value, mat: $("#tm").value, D: +$("#td").value || 0, Z: +$("#tz").value || 1, notes: $("#tNotes").value }; if (!t.loc || !t.name || !t.D) return toast("Missing required fields"); store.tools.push(t); save(); closeModal(); render(); }

      function machines() {
        return basePage("SYSTEM", "Machines", "Shop floor hardware capability definition.") + `<div class="grid g3">${Object.entries(MACHINES).map(([k, m]) => `<div class="card metric"><div class="metric-label">${m.type.toUpperCase()}</div><div class="metric-val" style="font-size:20px;">${esc(m.name)}</div><div class="metric-sub">Max RPM: ${m.rpm}</div></div>`).join("")}</div>`;
      }

      function settings() {
        return basePage("SYSTEM", "Data & Control", "Local browser storage. Export JSON to keep data safe.") + `<div class="card card-body grid g2"><button class="btn primary" onclick="downloadJSON(store,'datum-os-backup.json')">Export Backup (JSON)</button><button class="btn danger" onclick="resetData()">Factory Reset Data</button></div>`;
      }

      function resetData() { if (confirm("Permanently delete everything?")) { store = seed(); save(); render(); toast("Data wiped"); } }
      function modal(title, body) { $("#modalRoot").innerHTML = `<div class="modal-bg"><div class="modal"><div class="modal-head"><span>${esc(title)}</span><button class="modal-close" onclick="closeModal()">×</button></div><div class="modal-body">${body}</div></div></div>`; }
      function closeModal() { $("#modalRoot").innerHTML = ""; }
      function downloadJSON(data, name) { const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([JSON.stringify(data, null, 2)], { type: "application/json" })); a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 500); }
      function printView(title) { document.title = "DATUM OS — " + title; window.print(); }

      function bind() {
        if (store.active === "cut") { calcSF(); }
        if (store.active === "calc") {
          const tabs = $$("[data-cal]");
          tabs.forEach((b) => b.onclick = () => { tabs.forEach((x) => x.classList.remove("active")); b.classList.add("active"); const type = b.dataset.cal; $("#calcBody").innerHTML = type === "thread" ? calcThreadHtml() : type === "iso" ? isoView() : simpleCalc(type); if (type === "thread") doThread(); if (type === "iso") doIso(); if (type === "chamfer") doChamfer(); if (type === "triangle") doTri(); });
          doIso();
        }
      }

      $("#importInput").onchange = (e) => { const f = e.target.files[0]; if (!f) return; const r = new FileReader(); r.onload = () => { try { const x = JSON.parse(r.result); if (!x || x.version !== 6) throw new Error("version"); store = hydrate(x); save(); render(); toast("Backup imported"); } catch { toast("Invalid backup"); } }; r.readAsText(f); };

      render();
    </script>
  </body>
</html>
