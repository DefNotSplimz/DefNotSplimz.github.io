<!doctype html>
<html lang="da">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#070909" />
    <meta name="robots" content="noindex, nofollow" />
    <title>DATUM // SHOP FLOOR OS</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #070909;
        --panel: #0d1111;
        --panel2: #121818;
        --panel3: #182020;
        --line: #202a2a;
        --line2: #2d3939;
        --text: #e8eeee;
        --muted: #8d9999;
        --dim: #5a6666;
        --accent: #ff5a00;
        --good: #27d982;
        --warn: #ffb52e;
        --bad: #ff4f67;
        --blue: #5ad9ff;
        --shadow: 0 18px 50px rgba(0, 0, 0, 0.25);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
        color: var(--text);
        font-family:
          Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }
      body {
        overflow: hidden;
      }
      button,
      input,
      select,
      textarea {
        font: inherit;
        color: inherit;
      }
      button {
        cursor: pointer;
      }
      .hidden {
        display: none !important;
      }
      .app {
        display: grid;
        grid-template-columns: 250px 1fr;
        height: 100vh;
      }
      .rail {
        background: #080a0a;
        border-right: 1px solid var(--line);
        display: flex;
        flex-direction: column;
        min-width: 0;
      }
      .brand {
        height: 72px;
        padding: 0 18px;
        display: flex;
        align-items: center;
        border-bottom: 1px solid var(--line);
        font-weight: 900;
        letter-spacing: 0.12em;
      }
      .mark {
        width: 34px;
        height: 34px;
        display: grid;
        place-items: center;
        margin-right: 11px;
        border: 1px solid var(--accent);
        color: var(--accent);
        font-weight: 900;
      }
      .brand small {
        display: block;
        color: var(--dim);
        letter-spacing: 0.18em;
        font-size: 9px;
        margin-top: 3px;
      }
      .nav {
        padding: 14px 10px;
        overflow: auto;
        flex: 1;
      }
      .nav-group {
        margin-bottom: 17px;
      }
      .nav-label {
        font-size: 9px;
        font-weight: 900;
        color: var(--dim);
        letter-spacing: 0.18em;
        padding: 0 9px 7px;
        text-transform: uppercase;
      }
      .nav button {
        width: 100%;
        border: 0;
        background: transparent;
        text-align: left;
        padding: 9px 11px;
        border-radius: 7px;
        color: var(--muted);
        font-weight: 750;
        font-size: 12px;
        display: flex;
        gap: 10px;
        align-items: center;
      }
      .nav button:hover {
        background: var(--panel2);
        color: var(--text);
      }
      .nav button.active {
        background: rgba(255, 90, 0, 0.09);
        color: var(--accent);
      }
      .ico {
        width: 18px;
        text-align: center;
        opacity: 0.9;
      }
      .rail-bottom {
        border-top: 1px solid var(--line);
        padding: 12px;
      }
      .system {
        font-size: 10px;
        color: var(--dim);
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--good);
        box-shadow: 0 0 12px rgba(39, 217, 130, 0.7);
      }
      .main {
        min-width: 0;
        display: flex;
        flex-direction: column;
      }
      .top {
        height: 72px;
        border-bottom: 1px solid var(--line);
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 22px;
        background: linear-gradient(180deg, #090c0c, #070909);
        flex-shrink: 0;
      }
      .crumb {
        font-size: 11px;
        color: var(--muted);
        font-weight: 900;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }
      .top-actions {
        display: flex;
        gap: 8px;
        align-items: center;
      }
      .icon-btn,
      .soft {
        border: 1px solid var(--line);
        background: var(--panel);
        border-radius: 7px;
        min-height: 38px;
        padding: 0 12px;
        font-size: 11px;
        font-weight: 850;
      }
      .soft:hover,
      .icon-btn:hover {
        border-color: var(--line2);
        background: var(--panel2);
      }
      .primary {
        background: var(--accent);
        border: 1px solid var(--accent);
        color: #090909;
        border-radius: 7px;
        min-height: 40px;
        padding: 0 14px;
        font-weight: 950;
        font-size: 11px;
      }
      .primary:hover {
        filter: brightness(1.08);
      }
      .danger-btn {
        border-color: rgba(255, 79, 103, 0.3);
        color: var(--bad);
      }
      .workspace {
        overflow: auto;
        flex: 1;
        padding: 24px;
      }
      .page {
        max-width: 1580px;
        margin: 0 auto;
        display: flex;
        flex-direction: column;
        gap: 16px;
      }
      .hero {
        display: flex;
        justify-content: space-between;
        gap: 18px;
        align-items: flex-end;
      }
      .eyebrow {
        font-size: 9px;
        color: var(--dim);
        font-weight: 950;
        letter-spacing: 0.2em;
        text-transform: uppercase;
      }
      .h1 {
        font-size: 29px;
        font-weight: 950;
        letter-spacing: -0.03em;
        margin-top: 6px;
      }
      .sub {
        font-size: 12px;
        color: var(--muted);
        margin-top: 7px;
        max-width: 900px;
        line-height: 1.5;
      }
      .actions {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }
      .cards {
        display: grid;
        gap: 12px;
      }
      .cards4 {
        grid-template-columns: repeat(4, minmax(0, 1fr));
      }
      .cards3 {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }
      .cards2 {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
      .card {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 9px;
        box-shadow: var(--shadow);
      }
      .metric {
        padding: 16px;
      }
      .metric .label {
        font-size: 9px;
        color: var(--dim);
        letter-spacing: 0.14em;
        font-weight: 950;
        text-transform: uppercase;
      }
      .metric .value {
        font-size: 26px;
        font-weight: 950;
        margin-top: 8px;
      }
      .metric .delta {
        margin-top: 5px;
        color: var(--muted);
        font-size: 10px;
      }
      .layout2 {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 420px;
        gap: 14px;
      }
      .layout3 {
        display: grid;
        grid-template-columns: 1.1fr 0.9fr 0.9fr;
        gap: 14px;
      }
      .section {
        padding: 16px;
      }
      .section-head {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 10px;
        margin-bottom: 12px;
      }
      .section-title {
        font-size: 10px;
        color: var(--dim);
        font-weight: 950;
        letter-spacing: 0.15em;
        text-transform: uppercase;
      }
      .section-head h2 {
        font-size: 15px;
        margin: 0;
      }
      .table-wrap {
        overflow: auto;
        border: 1px solid var(--line);
        border-radius: 8px;
      }
      .table {
        width: 100%;
        border-collapse: collapse;
        min-width: 760px;
      }
      .table th {
        font-size: 9px;
        color: var(--dim);
        text-transform: uppercase;
        letter-spacing: 0.12em;
        text-align: left;
        background: var(--panel2);
      }
      .table th,
      .table td {
        padding: 10px 11px;
        border-bottom: 1px solid var(--line);
        vertical-align: middle;
      }
      .table tr:last-child td {
        border-bottom: 0;
      }
      .table td {
        font-size: 12px;
        font-weight: 650;
      }
      .table input,
      .table select {
        min-height: 34px;
        border: 1px solid transparent;
        background: transparent;
        padding: 5px 6px;
        border-radius: 5px;
        width: 100%;
      }
      .table input:focus,
      .table select:focus {
        border-color: var(--accent);
        background: #0a0d0d;
        outline: 0;
      }
      .status {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        padding: 4px 7px;
        border-radius: 999px;
        font-size: 9px;
        font-weight: 950;
        text-transform: uppercase;
      }
      .s-good {
        background: rgba(39, 217, 130, 0.09);
        color: var(--good);
      }
      .s-warn {
        background: rgba(255, 181, 46, 0.1);
        color: var(--warn);
      }
      .s-bad {
        background: rgba(255, 79, 103, 0.1);
        color: var(--bad);
      }
      .s-neutral {
        background: rgba(141, 153, 153, 0.09);
        color: var(--muted);
      }
      .grid {
        display: grid;
        gap: 10px;
      }
      .form2 {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
      .form3 {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }
      .form4 {
        grid-template-columns: repeat(4, minmax(0, 1fr));
      }
      .field {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .field label {
        font-size: 9px;
        color: var(--dim);
        font-weight: 950;
        letter-spacing: 0.11em;
        text-transform: uppercase;
      }
      .field input,
      .field select,
      .field textarea,
      .search {
        width: 100%;
        border: 1px solid var(--line);
        background: #0a0d0d;
        border-radius: 7px;
        padding: 10px 11px;
        min-height: 40px;
      }
      .field textarea {
        min-height: 100px;
        resize: vertical;
      }
      .field input:focus,
      .field select:focus,
      .field textarea:focus,
      .search:focus {
        border-color: var(--accent);
        outline: 0;
      }
      .divider {
        height: 1px;
        background: var(--line);
        margin: 14px 0;
      }
      .list {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 11px;
        border: 1px solid var(--line);
        background: #0a0d0d;
        border-radius: 7px;
      }
      .row strong {
        font-size: 12px;
      }
      .muted {
        color: var(--muted);
      }
      .dim {
        color: var(--dim);
      }
      .big {
        font-size: 38px;
        font-weight: 950;
        letter-spacing: -0.05em;
      }
      .orange {
        color: var(--accent);
      }
      .green {
        color: var(--good);
      }
      .red {
        color: var(--bad);
      }
      .blue {
        color: var(--blue);
      }
      .warn {
        color: var(--warn);
      }
      .toolbar {
        display: flex;
        gap: 8px;
        align-items: center;
        flex-wrap: wrap;
      }
      .grow {
        flex: 1;
      }
      .kpi-strip {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }
      .chip {
        border: 1px solid var(--line);
        background: var(--panel2);
        border-radius: 999px;
        padding: 6px 9px;
        font-size: 9px;
        font-weight: 850;
        color: var(--muted);
      }
      .mini {
        font-size: 9px;
        color: var(--dim);
      }
      .tabs {
        display: flex;
        gap: 6px;
        overflow: auto;
        border-bottom: 1px solid var(--line);
        padding-bottom: 1px;
      }
      .tabs button {
        border: 1px solid transparent;
        background: transparent;
        color: var(--muted);
        padding: 9px 12px;
        border-radius: 6px 6px 0 0;
        font-size: 10px;
        font-weight: 950;
        white-space: nowrap;
      }
      .tabs button.active {
        color: var(--accent);
        background: var(--panel);
        border-color: var(--line);
        border-bottom-color: var(--panel);
      }
      .output {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 1px;
        background: var(--line);
        border: 1px solid var(--line);
        border-radius: 9px;
        overflow: hidden;
      }
      .out {
        background: var(--panel);
        padding: 18px;
      }
      .out.main {
        grid-column: 1/-1;
        background: #0a0d0d;
      }
      .out .lab {
        font-size: 9px;
        color: var(--dim);
        font-weight: 950;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }
      .out .num {
        font-size: 36px;
        font-weight: 950;
        margin-top: 9px;
      }
      .out .num small {
        font-size: 11px;
        color: var(--dim);
        font-weight: 850;
      }
      .warning {
        padding: 12px;
        border: 1px solid rgba(255, 181, 46, 0.25);
        background: rgba(255, 181, 46, 0.06);
        color: var(--warn);
        font-size: 10px;
        font-weight: 850;
        border-radius: 8px;
      }
      .danger {
        border-color: rgba(255, 79, 103, 0.25);
        background: rgba(255, 79, 103, 0.06);
        color: var(--bad);
      }
      .success {
        border-color: rgba(39, 217, 130, 0.25);
        background: rgba(39, 217, 130, 0.06);
        color: var(--good);
      }
      .kanban {
        display: grid;
        grid-template-columns: repeat(4, minmax(240px, 1fr));
        gap: 10px;
        overflow: auto;
      }
      .lane {
        background: #090c0c;
        border: 1px solid var(--line);
        border-radius: 8px;
        min-height: 290px;
      }
      .lane-head {
        padding: 11px;
        border-bottom: 1px solid var(--line);
        font-size: 9px;
        font-weight: 950;
        letter-spacing: 0.14em;
        color: var(--dim);
      }
      .ticket {
        margin: 9px;
        padding: 11px;
        border: 1px solid var(--line);
        background: var(--panel);
        border-radius: 7px;
      }
      .ticket .title {
        font-size: 12px;
        font-weight: 900;
      }
      .ticket .meta {
        font-size: 9px;
        color: var(--muted);
        margin-top: 7px;
        line-height: 1.45;
      }
      .ticket:hover {
        border-color: var(--line2);
        cursor: pointer;
      }
      .progress {
        height: 7px;
        background: #151b1b;
        border-radius: 999px;
        overflow: hidden;
        margin-top: 8px;
      }
      .progress > span {
        display: block;
        height: 100%;
        background: var(--accent);
      }
      .bar-chart {
        height: 120px;
        display: flex;
        align-items: flex-end;
        gap: 6px;
      }
      .bar {
        flex: 1;
        background: linear-gradient(180deg, var(--accent), rgba(255, 90, 0, 0.15));
        border-radius: 3px 3px 0 0;
        min-height: 5px;
      }
      .empty {
        padding: 28px;
        text-align: center;
        color: var(--dim);
        font-size: 11px;
      }
      .toast {
        position: fixed;
        right: 18px;
        bottom: 18px;
        padding: 12px 14px;
        border: 1px solid var(--line2);
        background: #0d1111;
        box-shadow: var(--shadow);
        border-radius: 8px;
        font-size: 11px;
        z-index: 100;
      }
      .modal {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.7);
        display: grid;
        place-items: center;
        padding: 18px;
        z-index: 90;
      }
      .modal-card {
        width: min(1050px, 100%);
        max-height: 90vh;
        overflow: auto;
        background: var(--panel);
        border: 1px solid var(--line2);
        border-radius: 10px;
        box-shadow: var(--shadow);
      }
      .modal-head {
        padding: 15px 17px;
        border-bottom: 1px solid var(--line);
        display: flex;
        justify-content: space-between;
        align-items: center;
        position: sticky;
        top: 0;
        background: var(--panel);
        z-index: 2;
      }
      .modal-head strong {
        font-size: 12px;
      }
      .modal-body {
        padding: 17px;
      }
      .close {
        border: 0;
        background: transparent;
        color: var(--muted);
        font-size: 20px;
      }
      .cmd {
        display: flex;
        gap: 8px;
      }
      .cmd input {
        flex: 1;
        border: 1px solid var(--line);
        background: #0a0d0d;
        border-radius: 7px;
        padding: 10px;
      }
      .divider-label {
        font-size: 10px;
        color: var(--dim);
        font-weight: 950;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }
      .timeline {
        display: grid;
        gap: 0;
      }
      .timeline .item {
        display: grid;
        grid-template-columns: 86px 1fr;
        gap: 12px;
        padding: 11px 0;
        border-bottom: 1px solid var(--line);
      }
      .timeline .item:last-child {
        border-bottom: 0;
      }
      .timeline .time {
        color: var(--dim);
        font-size: 10px;
      }
      .check {
        display: flex;
        gap: 8px;
        align-items: center;
        font-size: 11px;
      }
      .check input {
        width: 15px;
        height: 15px;
      }
      .two-col-list {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }
      .print-sheet {
        display: none;
      }
      .mobile-nav {
        display: none;
      }
      .mobile-bar {
        display: none;
      }
      @media (max-width: 1100px) {
        .app {
          grid-template-columns: 78px 1fr;
        }
        .brandtext,
        .rail .nav-label,
        .rail .nav button span,
        .rail .system span {
          display: none;
        }
        .brand {
          justify-content: center;
          padding: 0;
        }
        .rail .nav button {
          justify-content: center;
        }
        .cards4 {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
        .layout2,
        .layout3 {
          grid-template-columns: 1fr;
        }
        .form4 {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
        .workspace {
          padding: 16px;
        }
      }
      @media (max-width: 740px) {
        body {
          overflow: hidden;
        }
        .app {
          display: block;
        }
        .rail {
          display: none;
        }
        .main {
          height: 100vh;
        }
        .top {
          height: 58px;
          padding: 0 12px;
        }
        .crumb {
          font-size: 10px;
        }
        .top-actions .icon-btn:nth-child(1) {
          display: none;
        }
        .workspace {
          padding: 12px 10px 78px;
        }
        .page {
          gap: 12px;
        }
        .hero {
          display: block;
        }
        .actions {
          margin-top: 12px;
        }
        .cards4,
        .cards3,
        .cards2 {
          grid-template-columns: 1fr;
        }
        .form4,
        .form3,
        .form2 {
          grid-template-columns: 1fr;
        }
        .output {
          grid-template-columns: 1fr;
        }
        .out.main {
          grid-column: 1;
        }
        .kanban {
          grid-template-columns: 1fr;
        }
        .table {
          min-width: 700px;
        }
        .mobile-bar {
          display: block;
          position: fixed;
          bottom: 0;
          left: 0;
          right: 0;
          height: 62px;
          background: #090b0b;
          border-top: 1px solid var(--line);
          z-index: 60;
        }
        .mobile-nav {
          display: grid;
          grid-template-columns: repeat(5, 1fr);
          height: 100%;
        }
        .mobile-nav button {
          border: 0;
          background: transparent;
          color: var(--muted);
          font-size: 9px;
          font-weight: 900;
        }
        .mobile-nav button.active {
          color: var(--accent);
        }
      }
      @media print {
        body {
          overflow: visible !important;
          background: #fff;
          color: #000;
        }
        .rail,
        .top,
        .mobile-bar,
        .actions,
        .print-hide {
          display: none !important;
        }
        .main {
          display: block;
        }
        .workspace {
          overflow: visible;
          padding: 0;
        }
        .page {
          max-width: none;
        }
        .card,
        .table-wrap,
        .output {
          box-shadow: none;
          background: #fff;
          border: 1px solid #000;
          color: #000;
        }
        .print-sheet {
          display: block !important;
        }
        .screen-print {
          display: block !important;
        }
        .muted,
        .dim {
          color: #444;
        }
        .status {
          border: 1px solid #000;
          background: #fff;
          color: #000;
        }
        .table th {
          background: #eee;
          color: #000;
        }
        .table td,
        .table th {
          border-color: #000;
        }
        .out {
          background: #fff;
        }
        .out .lab {
          color: #444;
        }
        .out .num {
          color: #000;
        }
        .print-only {
          display: block !important;
        }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <aside class="rail">
        <div class="brand">
          <div class="mark">D</div>
          <div class="brandtext">DATUM<small>SHOP FLOOR OS</small></div>
        </div>
        <nav class="nav" id="nav"></nav>
        <div class="rail-bottom">

        store.setups = store.setups.filter((s) => s.jobId !== id);
        store.measurements = store.measurements.filter((m) => m.jobId !== id);
        store.fai = store.fai.filter((f) => f.jobId !== id);
        store.timeLogs = store.timeLogs.filter((t) => t.jobId !== id);
        store.documents = store.documents.filter((d) => d.jobId !== id);
        store.quotes.forEach((q) => {
          if (q.jobId === id) {
            q.jobId = null;
            q.status = "SENT";
          }
        });
        if (store.draft.jobId === id) store.draft.jobId = null;
        if (store.measureDraft.jobId === id) store.measureDraft.jobId = null;
        log("Job deleted", id);
        save();
        closeModal();
        render();
        toast("Job slettet");

      function createJob() {
        const id = $("#mJob").value.trim() || uid("WO");
        if (store.jobs.some((j) => j.id === id)) {
          toast("Jobnummer findes allerede");
          return;
        }
        const machineKey = $("#mMachine").value,
          j = defaultJob({
            id,
            part: $("#mPart").value.trim() || "PART-NEW",
            rev: $("#mRev").value.trim() || "A",
            customer: $("#mCustomer").value.trim() || "Internal R&D",
            qty: Math.max(1, +$("#mQty").value || 1),
            machine: MACHINES[machineKey].name,
            due: $("#mDue").value || today(),
            material: $("#mMat").value,
            program: $("#mProg").value.toUpperCase() || "O0100",
          });
        store.jobs.unshift(j);
        store.routeRows.push(
          {
            id: uid("R"),
            jobId: j.id,
            op: 10,
            desc: "Råmateriale / klargøring",
            machine: j.machine,
            plan: 10,
            setup: 0,
            status: "QUEUED",
          },
          {
            id: uid("R"),
            jobId: j.id,
            op: 20,
            desc: "Primær bearbejdning",
            machine: j.machine,
            plan: j.estimatedCycle || 15,
            setup: store.settings.setup,
            status: "QUEUED",
          },
          {
            id: uid("R"),
            jobId: j.id,
            op: 30,
            desc: "Efterbearbejdning",
            machine: j.machine,
            plan: 5,
            setup: 5,
            status: "QUEUED",
          },

            id: uid("R"),

            op: 40,

            machine: "Inspection",
            plan: 5,
            setup: 0,
            status: "QUEUED",
          }
        );
        store.draft = {
          ...store.draft,
          part: j.part,
          rev: j.rev,
          customer: j.customer,
          qty: j.qty,
          material: j.material,
          machine: machineKey,
          program: j.program,

        };
        store.measureDraft = { jobId: j.id };
        log("Job created", j.id + " · " + j.part);
        save();
        closeModal();
        render();
        toast("Job oprettet: " + j.id);
      }

      function updateJob(id) {
        const j = jobBy(id);
        if (!j) return;
        j.status = $("#ojStatus").value;
        j.progress = Math.min(100, Math.max(0, +$("#ojProg").value || 0));
        j.priority = $("#ojPriority").value;
        if (j.status === "COMPLETE") j.progress = 100;
        j.updated = nowTime();
        log("Job updated", id + " → " + j.status);
        save();
        closeModal();
        render();
        toast("Job opdateret");
      }
      function openModule(v, id) {
        store.active = v;
        if (id) {
          const j = jobBy(id);
          if (j) {
            store.draft = {
              ...store.draft,
              jobId: id,
              part: j.part,
              rev: j.rev,
              customer: j.customer,
              qty: j.qty,
              machine: Object.keys(MACHINES).find((k) => MACHINES[k].name === j.machine) || store.draft.machine,
              material: j.material,
              program: j.program,
            };
            store.measureDraft = { ...(store.measureDraft || {}), jobId: id };
          }
        }
        save();
        closeModal();
        render();
      }

      function quoteCalc() {
        if (!$("#qQty")) return;
        const qty = Math.max(1, +$("#qQty").value || 1),
          cycle = Math.max(0, +$("#qCycle").value || 0),
          rate = Math.max(0, +$("#qRate").value || 0),
          setup = Math.max(0, +$("#qSetup").value || 0),
          prog = Math.max(0, +$("#qProg").value || 0),
          mat = Math.max(0, +$("#qMat").value || 0),
          ext = Math.max(0, +$("#qExt").value || 0),
          risk = Math.max(0, +$("#qRisk").value || 0) / 100,
          margin = Math.max(0, +$("#qMargin").value || 0) / 100,
          rush = Math.max(0, +$("#qRush").value || 0) / 100;
        const lineCost = currentQuoteLines().reduce((a, l) => a + (+l.cost || 0), 0),
          run = ((cycle * qty) / 60) * rate,
          setupCost = (setup / 60) * rate,
          progCost = prog * rate,
          matCost = mat * qty,
          base = run + setupCost + progCost + matCost + ext + lineCost,
          riskCost = base * risk,
          sub = base + riskCost,
          selling = (sub / Math.max(0.01, 1 - margin)) * (1 + rush),
          hours = (cycle * qty + setup) / 60 + prog,
          qp = selling / qty,
          gp = selling ? ((selling - base) / selling) * 100 : 0;
        $("#qTotal").textContent = money(selling);
        $("#qPiece").textContent = money(qp);
        $("#qHours").textContent = hours.toFixed(1);
        $("#qCost").textContent = money(base);
        $("#qGp").textContent = gp.toFixed(1) + "%";
        $("#qBreak").innerHTML = [
          "RUN: " + money(run),
          "SETUP: " + money(setupCost),
          "PROGRAM: " + money(progCost),
          "MATERIAL: " + money(matCost),
          "EXTERNAL: " + money(ext),
          "ADD-ONS: " + money(lineCost),
          "RISK: " + money(riskCost),
        ].join(" · ");
        store.draft = {
          ...store.draft,
          customer: $("#qCustomer").value,
          part: $("#qPart").value,
          rev: $("#qRev").value,
          qty,
          machine: $("#qMachine").value,
          cycle,
          rate,
          setup,
          programHours: prog,
          materialCost: mat,
          external: ext,
          risk: risk * 100,
          margin: margin * 100,
          rush: rush * 100,
          note: $("#qNote").value,
          quoteTotal: selling,
          quoteCost: base,
        };
        save();
        return selling;
      }

TO</span></div><div class="row"><div><strong>Small ae</strong><div class="muted">Reducerer ikke automatisk din maskine — viser flag</div></div><span class="chip">AUTO</span></div><div class="warning">Skæredata er en engineering recommendation. Kontrollér producentdata, opspænding, værktøj, materiale, maskine og køling før kørsel.</div></div></div></div>'

      function calcSF() {
        const machineKey = $("#sfMachine").value,
          m = MACHINES[machineKey] || MACHINES.hsm,
          mat = MATERIALS[$("#sfMat").value] || MATERIALS.alu_6082;
        const isTurn = m.type === "turn";
        let tk = $("#sfTool").value,
          tool = isTurn ? TOOL_BASE.turn[tk] : TOOL_BASE.mill[tk],
          cribTool = null;
        if (tk?.startsWith("crib:")) {
          cribTool = store.tools.find((t) => String(t.id) === tk.slice(5));
          if (cribTool) tool = { ...cribTool, vc: 1, f: 1, z: cribTool.Z || 1 };
        }
        const D = Math.max(0.001, +$("#sfD").value || 0),
          Z = Math.max(1, +$("#sfZ").value || tool?.z || 4),
          L = +$("#sfL").value || 0,
          ae = Math.max(0, +$("#sfAe").value || 0),
          ap = Math.max(0, +$("#sfAp").value || 0),
          strategy = { normal: [1, 1, 0.15, 1], skrub: [0.85, 1.25, 0.4, 1.5], slet: [1.2, 0.6, 0.05, 2] }[
            $("#sfStrategy").value
          ] || [1, 1, 0.15, 1];
        let vc = mat.vc * (tool?.vc || 1) * strategy[0],
          rpmIdeal = (vc * 1000) / (Math.PI * D),
          rpm = Math.min(rpmIdeal, m.rpm),
          feedPerRev = mat.f * (tool?.f || 1) * strategy[1],
          vf = 0,
          mrr = 0,
          ld = isTurn ? "TURN" : L / D,
          flags = [];
        if (isTurn) {
          vf = feedPerRev;
          mrr = ap * vf * vc;
          if (ap <= 0) flags.push("AP UDFYLDT");
          if (cribTool?.type && !String(cribTool.type).startsWith("turn_")) flags.push("VÆRKTØJ ER IKKE EN DREJESTIK");
          if (machineKey === "deckel" || machineKey === "hsm") flags.push("MASKINEN ER EN FRÆSER");
        } else {
          if (ae > 0 && ae < D / 2) feedPerRev *= Math.min(Math.sqrt(D / ae), 3);
          vf = rpm * Z * feedPerRev;
          mrr = (ap * ae * vf) / 1000;
          if (ld >= 4) flags.push("HØJ L/D RISIKO");
          if (!ae || !ap) flags.push("MRR INDTIL AE/AP ER UDFYLDT");
        }
        if (rpmIdeal > m.rpm) flags.push("MAX SPINDEL NÅET");
        $("#sfRpm").textContent = Math.round(rpm).toLocaleString("da-DK");
        $("#sfVf").textContent = isTurn ? vf.toFixed(3) : Math.round(vf).toLocaleString("da-DK");
        $("#sfLd").textContent = isTurn ? "TURN" : ld.toFixed(2);
        $("#sfMrr").textContent = mrr.toFixed(1);
        $("#sfVc").textContent = Math.round(vc);
        $("#sfFz").textContent = feedPerRev.toFixed(3);
        $("#sfVfUnit").textContent = isTurn ? "mm/omdr" : "mm/min";
        $("#sfFzUnit").textContent = isTurn ? "mm/omdr" : "mm/tand";
        $("#sfFlags").innerHTML = flags.length

      function calcThreadHtml() {

      function doThread() {
        const d = +$("#thrD").value || 0,
          p = +$("#thrP").value || 0,

        $("#thrCut").textContent = (d - p * (hard ? 0.85 : 1)).toFixed(2) + " mm";

      function isoCalc(d, c) {
        c = (c || "").trim();
        let i = ISO.ranges.findIndex((x) => d <= x);
        if (i < 0) i = ISO.ranges.length - 1;
        const a = ISO.classes[c];
        return a?.[i] ? { lo: a[i][1] / 1000, up: a[i][0] / 1000 } : null;
      }
      function isoView() {
        return '<div class="layout2"><div class="card section"><div class="grid form2"><div class="field"><label>Nominel Ø</label><input id="isoD" type="number" value="25" oninput="doIso()"></div><div class="field"><label>Pasning</label><input id="isoClass" value="H7" style="text-transform:uppercase" oninput="doIso()"></div></div></div><div class="output"><div class="out main"><div class="lab">TARGET</div><div class="num" id="isoTarget">—</div></div><div class="out"><div class="lab">MIN</div><div class="num" id="isoMin">—</div></div><div class="out"><div class="lab">MAX</div><div class="num" id="isoMax">—</div></div></div></div>';
      }
      function doIso() {
        const d = +$("#isoD").value || 0,
          r = isoCalc(d, $("#isoClass").value);
        $("#isoTarget").textContent = d.toFixed(3) + " mm";
        if (r) {
          $("#isoMin").textContent = (d + r.lo).toFixed(3);
          $("#isoMax").textContent = (d + r.up).toFixed(3);
        } else {
          $("#isoMin").textContent = "—";
          $("#isoMax").textContent = "—";
        }
      }
      function simpleCalc(type) {
        if (type === "rough")
          return '<div class="layout2"><div class="card section"><div class="grid form2"><div class="field"><label>Corner radius re</label><input id="re" type="number" value="0.4" oninput="doRough()"></div><div class="field"><label>Feed f</label><input id="rf" type="number" value="0.1" oninput="doRough()"></div></div></div><div class="output"><div class="out main"><div class="lab">THEORETICAL RA</div><div class="num" id="ra">—</div><small>µm</small></div><div class="out"><div class="lab">RZ</div><div class="num" id="rz">—</div><small>µm</small></div></div></div>';
        if (type === "chamfer")
          return '<div class="layout2"><div class="card section"><div class="grid form2"><div class="field"><label>Fas bredde C</label><input id="fc" type="number" value="2.5" oninput="doChamfer()"></div><div class="field"><label>Vinkel</label><select id="fa" onchange="doChamfer()"><option value="90">90°</option><option value="60">60°</option><option value="120">120°</option><option value="82">82°</option></select></div></div></div><div class="output"><div class="out main"><div class="lab">NØDVENDIG Z-DYBDE</div><div class="num" id="fz">—</div></div></div></div>';
        if (type === "cone")
          return '<div class="layout2"><div class="card section"><div class="grid form3"><div class="field"><label>Stor Ø</label><input id="cd" type="number" value="50" oninput="doCone()"></div><div class="field"><label>Lille Ø</label><input id="cdd" type="number" value="30" oninput="doCone()"></div><div class="field"><label>Længde L</label><input id="cl" type="number" value="40" oninput="doCone()"></div></div></div><div class="output"><div class="out main"><div class="lab">TOPSLÆDE VINKEL (a/2)</div><div class="num" id="ca">—</div></div></div></div>';
        if (type === "bhc")
          return '<div class="layout2"><div class="card section"><div class="grid form3"><div class="field"><label>BHC Ø</label><input id="bd" type="number" value="100" oninput="doBhc()"></div><div class="field"><label>Antal</label><input id="bn" type="number" value="6" oninput="doBhc()"></div><div class="field"><label>Startvinkel</label><input id="ba" type="number" value="0" oninput="doBhc()"></div></div></div><div class="card section"><div class="section-title">COORDINATES X / Y</div><div id="coords" class="list" style="margin-top:10px"></div></div></div>';
        return '<div class="layout2"><div class="card section"><div class="grid form3"><div class="field"><label>Angle A</label><input id="ta" type="number" value="30" oninput="doTri()"></div><div class="field"><label>Side A</label><input id="tsa" type="number" value="50" oninput="doTri()"></div><div class="field"><label>Side B</label><input id="tsb" type="number" value="25" oninput="doTri()"></div></div></div><div class="output"><div class="out main"><div class="lab">SIDE C</div><div class="num" id="tc">—</div></div><div class="out"><div class="lab">ANGLE B</div><div class="num" id="tb">—</div></div></div></div>';
      }
      function doRough() {
        const re = +$("#re").value || 0,
          f = +$("#rf").value || 0,
          ra = re ? ((f * f) / (32 * re)) * 1000 : 0;
        $("#ra").textContent = ra.toFixed(2);
        $("#rz").textContent = (ra * 4).toFixed(2);
      }
      function doChamfer() {
        const c = +$("#fc").value || 0,
          a = ((+$("#fa").value || 90) * Math.PI) / 180;
        $("#fz").textContent = Math.abs(c * Math.tan(a / 2)).toFixed(3) + " mm";
      }
      function doCone() {
        const D = +$("#cd").value || 0,
          d = +$("#cdd").value || 0,
          L = +$("#cl").value || 0;
        $("#ca").textContent = L ? ((Math.atan((D - d) / 2 / L) * 180) / Math.PI).toFixed(3) + "°" : "—";
      }
      function doBhc() {
        const D = +$("#bd").value || 0,
          n = Math.max(0, Math.floor(+$("#bn").value || 0)),
          a = ((+$("#ba").value || 0) * Math.PI) / 180,
          r = D / 2;
        $("#coords").innerHTML =
          Array.from({ length: n }, (_, i) => {
            const t = a + (i * 2 * Math.PI) / n;
            return (
              '<div class="row"><b class="orange">H' +
              (i + 1) +
              "</b><span>X " +
              (r * Math.cos(t)).toFixed(3) +
              " · Y " +
              (r * Math.sin(t)).toFixed(3) +
              "</span></div>"
            );
          }).join("") || '<div class="empty">—</div>';
      }
      function doTri() {
        const A = ((+$("#ta").value || 0) * Math.PI) / 180,
          a = +$("#tsa").value || 0,
          b = +$("#tsb").value || 0,
          c = Math.sqrt(Math.max(0, a * a + b * b - 2 * a * b * Math.cos(A)));
        const v = (a * a + c * c - b * b) / (2 * a * c || 1);
        const B = (Math.acos(Math.min(1, Math.max(-1, v))) * 180) / Math.PI;
        $("#tc").textContent = c.toFixed(3);
        $("#tb").textContent = B.toFixed(3) + "°";
      }

        r.status = r.status === "QUEUED" ? "RUN" : r.status === "RUN" ? "DONE" : "DONE";
        const j = jobBy(r.jobId);
        if (j) {
          const rows = store.routeRows.filter((x) => x.jobId === j.id);
          const done = rows.filter((x) => x.status === "DONE").length;
          const running = rows.some((x) => x.status === "RUN");
          j.progress = rows.length ? Math.round((done / rows.length) * 100) : j.progress;

          if (r.status === "DONE" && done === rows.length) {

            j.progress = 100;

              .map((m) => "<option>" + esc(m.name) + "</option>")
              .join("") +
            '</select></div><div class="field"><label>Coolant %</label><input id="mc" type="number" value="8.5"></div><div class="field"><label>Oil OK</label><select id="mo"><option>JA</option><option>NEJ</option></select></div><div class="field"><label>Next due</label><input id="mn" type="date" value=""></div><div class="field"><label>Operator</label><input id="mw" value="GCH"></div><div class="field" style="grid-column:1/-1"><label>Note</label><textarea id="mt">Daily inspection OK</textarea></div></div><div class="divider"></div>' +
            button("SAVE", "saveMaintenance()", "primary")
        );
      }
      function saveMaintenance() {
        const x = {
          id: uid("MT"),
          date: $("#md").value,
          machine: $("#mm").value,
          coolant: +$("#mc").value || 0,
          oil: $("#mo").value,
          nextDue: $("#mn").value,
          who: $("#mw").value,
          note: $("#mt").value,
        };
        store.maintenance.unshift(x);
        log("Maintenance logged", x.machine + " · " + x.date);
        save();
        closeModal();
        render();
      }

      function machines() {
        return (
          basePage(
            "ASSET",
            "Machine Center",
            "Maskiner som produktionsobjekter: spindle limit, machine family, rate og availability.",
            button("+ ADD MACHINE", "machineModal()")
          ) +
          '<div class="cards cards2">' +
          Object.entries(MACHINES)
            .map(
              ([k, m]) =>
                '<div class="card section"><div class="section-head"><div><div class="section-title">' +
                (m.type === "mill" ? "MILLING" : "TURNING") +
                "</div><h2>" +
                esc(m.name) +
                '</h2></div><span class="status s-good">' +
                esc(m.status) +
                '</span></div><div class="cards cards3"><div class="metric"><div class="label">MAX RPM</div><div class="value">' +
                m.rpm.toLocaleString("da-DK") +
                '</div></div><div class="metric"><div class="label">RATE</div><div class="value" style="font-size:18px">' +
                money(m.rate) +
                '/h</div></div><div class="metric"><div class="label">OPEN JOBS</div><div class="value">' +
                store.jobs.filter((j) => j.machine === m.name && j.status !== "COMPLETE").length +
                '</div></div></div><div class="toolbar">' +
                button("SET AVAILABLE", "setMachineStatus('" + k + "','AVAILABLE')") +
                button("SET HOLD", "setMachineStatus('" + k + "','HOLD')") +
                (store.machineOverrides && store.machineOverrides[k]
                  ? button("DELETE", "deleteMachine('" + k + "')", "soft danger-btn")
                  : "") +
                "</div></div>"
            )
            .join("") +
          "</div>"
        );
      }
      function machineModal() {
        modal(
          "ADD MACHINE",
          '<div class="grid form3"><div class="field"><label>Key</label><input id="mk" value="newmachine"></div><div class="field"><label>Name</label><input id="mnm" value="New Machine"></div><div class="field"><label>Type</label><select id="mkt"><option value="mill">MILLING</option><option value="turn">TURNING</option></select></div><div class="field"><label>Max RPM</label><input id="mrpm" type="number" value="2000"></div><div class="field"><label>Rate / h</label><input id="mrate" type="number" value="500"></div></div><div class="divider"></div>' +
            button("CREATE MACHINE", "createMachine()", "primary")
        );
      }
      function createMachine() {
        const k = $("#mk").value.trim();
        if (!k || MACHINES[k]) {
          toast("Machine key findes allerede eller er tom");
          return;
        }
        MACHINES[k] = {
          name: $("#mnm").value,
          type: $("#mkt").value,
          rpm: +$("#mrpm").value || 0,
          rate: +$("#mrate").value || 0,
          status: "AVAILABLE",
        };
        store.machineOverrides = store.machineOverrides || {};
        store.machineOverrides[k] = MACHINES[k];
        save();
        closeModal();
        render();
        toast("Machine created");
      }
      function setMachineStatus(k, status) {
        MACHINES[k].status = status;
        store.machineOverrides = store.machineOverrides || {};
        store.machineOverrides[k] = MACHINES[k];
        save();
        render();
        toast(MACHINES[k].name + " → " + status);
      }

      function reports() {
        const quoted = store.quotes.reduce((a, q) => a + q.total, 0),
          cost = store.quotes.reduce((a, q) => a + q.cost, 0),
          open = store.jobs.filter((j) => j.status !== "COMPLETE"),
          run = store.timeLogs.filter((x) => x.type === "RUN").reduce((a, x) => a + x.minutes, 0),
          all = store.timeLogs.reduce((a, x) => a + x.minutes, 0),
          pass = store.measurements.filter((x) => x.ok).length,
          meas = store.measurements.length;
        return (
          basePage(
            "CONTROL",
            "Reports / Analytics",
            "Efterkalkulation, throughput, QC og commercial signaler fra samme datasæt.",
            button("EXPORT FULL JSON", "downloadJSON(store,'datum-shop-floor-backup.json')") +
              " " +
              button("PRINT REPORT", "printView('Production Report')")
          ) +
          '<div class="cards cards4"><div class="card metric"><div class="label">QUOTED VALUE</div><div class="value">' +
          money(quoted) +
          '</div></div><div class="card metric"><div class="label">OPEN JOBS</div><div class="value">' +
          open.length +
          '</div></div><div class="card metric"><div class="label">RUN SHARE</div><div class="value">' +
          (all ? Math.round((run / all) * 100) : 0) +
          '%</div></div><div class="card metric"><div class="label">FIRST PASS</div><div class="value green">' +
          (meas ? Math.round((pass / meas) * 100) : 0) +
          '%</div></div></div><div class="layout2"><div class="card section"><div class="section-title">COMMERCIAL</div><h2 style="margin:6px 0 12px">Quote → job</h2><div class="list"><div class="row"><span>Quotes</span><b>' +
          store.quotes.length +
          '</b></div><div class="row"><span>Sent</span><b>' +
          store.quotes.filter((q) => q.status === "SENT").length +
          '</b></div><div class="row"><span>Won</span><b>' +
          store.quotes.filter((q) => q.status === "WON").length +
          '</b></div><div class="row"><span>Quoted cost base</span><b>' +
          money(cost) +
          '</b></div></div></div><div class="card section"><div class="section-title">PRODUCTION</div><h2 style="margin:6px 0 12px">Actual signals</h2><div class="list"><div class="row"><span>Total logged time</span><b>' +
          all +
          ' min</b></div><div class="row"><span>Run time</span><b>' +
          run +
          ' min</b></div><div class="row"><span>Open orders</span><b>' +
          open.length +
          '</b></div><div class="row"><span>Measurements</span><b>' +
          meas +
          '</b></div></div></div></div><div class="card section"><div class="section-title">DATA QUALITY</div><div class="warning">Rapporterne bliver kun så gode som dine actuals. Når du logger rigtig setup/run/wait/downtime, kommer forskellen mellem quote, plan og actual frem automatisk.</div></div>'
        );
      }

      function settings() {
        return (
          basePage("SYSTEM", "Settings / Data", "Local-first data model. Backup/restore og shop defaults.", "") +
          '<div class="layout2"><div class="card section"><div class="section-title">SHOP DEFAULTS</div><div class="grid form2" style="margin-top:12px"><div class="field"><label>Default rate / h</label><input type="number" value="' +
          store.settings.rate +
          '" oninput="store.settings.rate=+this.value||0;save()"></div><div class="field"><label>Margin %</label><input type="number" value="' +
          store.settings.margin +
          '" oninput="store.settings.margin=+this.value||0;save()"></div><div class="field"><label>Setup min</label><input type="number" value="' +
          store.settings.setup +
          '" oninput="store.settings.setup=+this.value||0;save()"></div><div class="field"><label>Program h</label><input type="number" value="' +
          store.settings.program +
          '" oninput="store.settings.program=+this.value||0;save()"></div><div class="field"><label>Risk %</label><input type="number" value="' +
          store.settings.risk +
          '" oninput="store.settings.risk=+this.value||0;save()"></div></div></div><div class="card section"><div class="section-title">DATA CONTROL</div><div class="list" style="margin-top:12px">' +
          button("EXPORT FULL OS", "downloadJSON(store,'datum-shop-floor-backup.json')", "primary") +
          button("IMPORT BACKUP", "$('#importInput').click()") +
          '</div><div class="divider"></div><div class="warning">Single-file local build: data ligger i browserens localStorage. Der er ingen multi-user sync eller ekstern DMS endnu. Jobs slettes ikke af systemet.</div></div></div>'
        );
      }

      function resetData() {
        if (confirm("Reset all local OS data?")) {
          store = seed();
          save();
          render();
          toast("Demo data reset");
        }
      }
      function modal(title, body) {
        $("#modalRoot").innerHTML =
          '<div class="modal" id="modal"><div class="modal-card"><div class="modal-head"><strong>' +
          esc(title) +
          '</strong><button class="close" onclick="closeModal()">×</button></div><div class="modal-body">' +
          body +
          "</div></div></div>";
      }
      function closeModal() {
        $("#modalRoot").innerHTML = "";
      }
      function downloadJSON(data, name) {
        const a = document.createElement("a");
        a.href = URL.createObjectURL(new Blob([JSON.stringify(data, null, 2)], { type: "application/json" }));
        a.download = name;
        a.click();
        setTimeout(() => URL.revokeObjectURL(a.href), 500);
      }
      function printView(title) {
        document.title = "DATUM — " + title;
        window.print();
      }

      function bind() {
        if (store.active === "jobs") {
          const f = () => {
            const q = ($("#jobSearch")?.value || "").toLowerCase(),
              s = $("#jobStatus")?.value || "ALL",
              m = $("#jobMachine")?.value || "ALL";
            $$("[data-job-row]").forEach((r) => {
              r.style.display =
                (!q || r.dataset.search.includes(q)) &&
                (s === "ALL" || r.dataset.status === s) &&
                (m === "ALL" || r.dataset.machine === m)
                  ? ""
                  : "none";
            });
          };
          $("#jobSearch")?.addEventListener("input", f);
          $("#jobStatus")?.addEventListener("change", f);
          $("#jobMachine")?.addEventListener("change", f);
        }
        if (store.active === "quote") {
          if (!store.quoteLinesOnce && currentQuoteLines().length === 0) {
            store.draft.quoteLines = [];
            save();
          }
          const ql = $("#qLines");
          if (ql) ql.innerHTML = quoteLineRows();
          quoteCalc();
        }
        if (store.active === "cut") {
          const m = $("#sfMachine");
          const mat = $("#sfMat");
          const t = $("#sfTool");
          if (m && store.sf?.machine) m.value = store.sf.machine;
          if (mat && store.sf?.mat) mat.value = store.sf.mat;
          if (t && store.sf?.tool && t.querySelector('option[value="' + CSS.escape(store.sf.tool) + '"]'))
            t.value = store.sf.tool;
          calcSF();
        }
        if (store.active === "calc") {
          initCalcTabs();
        }
        if (store.active === "nc") genNC();
      }

      function initCalcTabs() {
        const tabs = $$("[data-cal]");
        tabs.forEach(
          (b) =>
            (b.onclick = () => {
              tabs.forEach((x) => x.classList.remove("active"));
              b.classList.add("active");
              const type = b.dataset.cal;
              const body = type === "thread" ? calcThreadHtml() : type === "iso" ? isoView() : simpleCalc(type);
              $("#calcBody").innerHTML = body;
              if (type === "thread") doThread();
              if (type === "iso") doIso();
              if (type === "rough") doRough();
              if (type === "chamfer") doChamfer();
              if (type === "cone") doCone();
              if (type === "bhc") doBhc();
              if (type === "triangle") doTri();
            })
        );
        doThread();
      }

      function commandModal() {
        modal(
          "COMMAND CENTER",
          '<div class="cmd"><input id="cmdInput" autofocus placeholder="new job · quote · setup · speeds · qc · tools · report"><button class="primary" onclick="runCmd()">GO</button></div><div class="divider"></div><div class="list">' +
            navGroups
              .flatMap((g) => g[1])
              .map(
                ([id, ic, label]) =>
                  '<div class="row" onclick="store.active=\'' +
                  id +
                  "';save();closeModal();render()\"><div><strong>" +
                  label +
                  '</strong><div class="muted">Open module</div></div><span class="shortcut">GO</span></div>'
              )
              .join("") +
            "</div>"
        );
      }

      function runCmd() {
        const q = ($("#cmdInput")?.value || "").toLowerCase();
        if (q.includes("new") && q.includes("job")) {
          closeModal();
          newJobModal();
          return;
        }
        let id = q.includes("quote")
          ? "quote"
          : q.includes("setup")
            ? "setup"
            : q.includes("speed") || q.includes("feed")
              ? "cut"
              : q.includes("qc") || q.includes("measure")
                ? "qc"
                : q.includes("tool")
                  ? "tools"
                  : q.includes("report")
                    ? "reports"
                    : q.includes("maintenance")
                      ? "maint"
                      : q.includes("inventory")
                        ? "inventory"
                        : q.includes("schedule")
                          ? "calendar"
                          : q.includes("job")
                            ? "jobs"
                            : "dashboard";
        store.active = id;
        save();
        closeModal();
        render();
      }

      $("#exportBtn").onclick = () => downloadJSON(store, "datum-shop-floor-backup.json");
      $("#importInput").onchange = (e) => {
        const f = e.target.files[0];
        if (!f) return;
        const r = new FileReader();
        r.onload = () => {
          try {
            const x = JSON.parse(r.result);
            if (!x || x.version !== 3) throw new Error("version");
            store = hydrate(x);
            save();
            render();
            toast("Backup imported");
          } catch {
            toast("Invalid DATUM OS backup");
          }
        };
        r.readAsText(f);
      };
      $("#globalSearchBtn").onclick = () => commandModal();
      $("#newJobBtn").onclick = () => newJobModal();

      document.addEventListener("keydown", (e) => {
        const tag = document.activeElement?.tagName;
        if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k") {
          e.preventDefault();
          commandModal();
        } else if (tag !== "INPUT" && tag !== "TEXTAREA" && tag !== "SELECT" && e.key.toLowerCase() === "n")
          newJobModal();
        else if (tag !== "INPUT" && tag !== "TEXTAREA" && tag !== "SELECT" && e.key.toLowerCase() === "s") {
          store.active = "cut";
          save();
          render();
        } else if (tag !== "INPUT" && tag !== "TEXTAREA" && tag !== "SELECT" && e.key.toLowerCase() === "q") {
          store.active = "qc";
          save();
          render();
        } else if (tag !== "INPUT" && tag !== "TEXTAREA" && tag !== "SELECT" && e.key.toLowerCase() === "p")
          printView("DATUM Shop Floor Document");
      });

      if (store.machineOverrides) Object.assign(MACHINES, store.machineOverrides);
      render();
    </script>
  </body>
</html>
