        // --- ROUTER MOTOREN ---
        const router = {
            navigate: function(viewKey) {
                const view = views[viewKey];
                if (!view) return;
                document.getElementById('header-title').textContent = view.title;
                document.getElementById('header-sub').textContent = view.sub;
                document.getElementById('header-icon').setAttribute('data-lucide', view.icon);
                document.getElementById('app-root').innerHTML = view.html;
                
                document.querySelectorAll('.nav-btn').forEach(btn => {
                    if (btn.dataset.target === viewKey) {
                        btn.classList.replace('text-dim', 'text-orange');
                        btn.classList.remove('hover:text-f2f3f3');
                    } else {
                        btn.classList.replace('text-orange', 'text-dim');
                        btn.classList.add('hover:text-f2f3f3');
                    }
                });
                
                lucide.createIcons();
                
                if (viewKey === 'tools') renderToolList();
                if (viewKey === 'materials') renderMatList();
                if (viewKey === 'imd') {
                    initMaterials();
                    calc(true); // Tvinger autoudregning ved load
                }
                if (viewKey === 'sop') calcSop();
            }
        };

        // --- GLOBAL EVENT DELEGATION ---
        document.getElementById('app-root').addEventListener('click', function(e) {
            
            // --- VÆRKTØJ LOGIK ---
            if (e.target.closest('#btn-save-tool')) {
                const loc = document.getElementById('tool-loc').value.toUpperCase();
                const name = document.getElementById('tool-name').value;
                const type = document.getElementById('tool-type').value;
                const mat = document.getElementById('tool-mat').value;
                const D = parseFloat(document.getElementById('tool-D').value);
                const Z = parseInt(document.getElementById('tool-Z').value) || 1; 
                const L = parseFloat(document.getElementById('tool-L').value);
                const Lc = parseFloat(document.getElementById('tool-Lc').value);
                
                if (!loc || !name || !D || !L || !Lc) {
                    alert("Udfyld alle fysiske parametre for at gemme.");
                    return;
                }
                
                let toolsList = JSON.parse(localStorage.getItem('datum_tools')) || [];
                toolsList = toolsList.filter(t => t.loc && t.name && t.D); 

                toolsList.push({ id: Date.now(), loc: loc, name: name, type: type, mat: mat, D: D, Z: Z, L: L, Lc: Lc, wear: 'new' });
                
                toolsList.sort((a, b) => {
                    const strA = a.loc || "";
                    const strB = b.loc || "";
                    return (parseInt(strA.replace(/\D/g, '')) || 0) - (parseInt(strB.replace(/\D/g, '')) || 0);
                });

                localStorage.setItem('datum_tools', JSON.stringify(toolsList));
                
                ['tool-loc', 'tool-name', 'tool-D', 'tool-Z', 'tool-L', 'tool-Lc'].forEach(id => {
                    if(document.getElementById(id)) document.getElementById(id).value = '';
                });
                renderToolList();
            }

            if (e.target.closest('.delete-tool')) {
                const id = parseInt(e.target.closest('.delete-tool').dataset.id);
                let toolsList = JSON.parse(localStorage.getItem('datum_tools')) || [];
                toolsList = toolsList.filter(t => t.id !== id);
                localStorage.setItem('datum_tools', JSON.stringify(toolsList));
                renderToolList();
            }

            // --- MATERIAL VAULT LOGIK ---
            if (e.target.closest('#btn-save-mat')) {
                const alloy = document.getElementById('mat-alloy').value.toUpperCase();
                const form = document.getElementById('mat-form').value;
                const dims = document.getElementById('mat-dims').value;
                const qty = parseInt(document.getElementById('mat-qty').value) || 1;

                if (!alloy || !dims) {
                    alert("Udfyld legering og dimensioner.");
                    return;
                }

                let matList = JSON.parse(localStorage.getItem('datum_materials')) || [];
                matList.push({ id: Date.now(), alloy: alloy, form: form, dims: dims, qty: qty });
                localStorage.setItem('datum_materials', JSON.stringify(matList));

                document.getElementById('mat-alloy').value = '';
                document.getElementById('mat-dims').value = '';
                document.getElementById('mat-qty').value = '1';
                renderMatList();
            }

            if (e.target.closest('.delete-mat')) {
                const id = parseInt(e.target.closest('.delete-mat').dataset.id);
                let matList = JSON.parse(localStorage.getItem('datum_materials')) || [];
                matList = matList.filter(m => m.id !== id);
                localStorage.setItem('datum_materials', JSON.stringify(matList));
                renderMatList();
            }

            if (e.target.closest('.mat-qty-btn')) {
                const btn = e.target.closest('.mat-qty-btn');
                const id = parseInt(btn.dataset.id);
                const change = parseInt(btn.dataset.change);
                
                let matList = JSON.parse(localStorage.getItem('datum_materials')) || [];
                const matIndex = matList.findIndex(m => m.id === id);
                
                if (matIndex > -1) {
                    matList[matIndex].qty += change;
                    if (matList[matIndex].qty < 0) matList[matIndex].qty = 0; 
                    localStorage.setItem('datum_materials', JSON.stringify(matList));
                    renderMatList();
                }
            }
        });

        function applyStdThread() {
            const val = document.getElementById('sop-thr-std').value;
            if(val) {
                const parts = val.split(',');
                document.getElementById('sop-thr-d').value = parts[0];
                document.getElementById('sop-thr-p').value = parts[1];
                calcSop();
            }

            const list = document.getElementById('tool-list');
            if(!list) return;
            
            let toolsList = JSON.parse(localStorage.getItem('datum_tools')) || [];
            const validTools = toolsList.filter(t => t.loc && t.name && t.D);
            if(validTools.length !== toolsList.length) {
                toolsList = validTools;
                localStorage.setItem('datum_tools', JSON.stringify(toolsList));

            if(toolsList.length === 0) {
                list.innerHTML = `<div class="border border-dashed border-line2 rounded-xl p-4 text-center"><div class="text-[10px] uppercase font-mono text-dim">Crib er tom.</div></div>`;
                return;
            }
            list.innerHTML = toolsList.map(t => {
                const typeLabel = geomLabels[t.type || 'endmill'] || 'Ukendt';
                const matLabel = matLabels[t.mat || 'hm'] || 'HM';

                return `

                        <div class="flex gap-2 mt-1.5 flex-wrap">

                            <span class="chip text-dim"><i data-lucide="scissors" class="inline w-2 h-2"></i> ${t.Z} FL</span>

                            ${displayLc}

                    </div>
                    <button class="delete-tool w-8 h-8 rounded border border-line2 text-dim hover:text-red hover:border-red/50 grid place-items-center shrink-0" data-id="${t.id}"><i data-lucide="x" class="w-3.5 h-3.5"></i></button>
                </div>
            `}).join('');
            lucide.createIcons();
        }

        function renderMatList() {
            const list = document.getElementById('mat-list');
            if(!list) return;
            
            let matList = JSON.parse(localStorage.getItem('datum_materials')) || [];

            if(matList.length === 0) {
                list.innerHTML = `<div class="border border-dashed border-line2 rounded-xl p-4 text-center"><div class="text-[10px] uppercase font-mono text-dim">Lageret er tomt.</div></div>`;
                return;
            }
            
            list.innerHTML = matList.map(m => {
                let icon = 'box';
                if(m.form === 'Rundstang' || m.form === 'Rør') icon = 'cylinder';
                if(m.form === 'Plade') icon = 'square';
                if(m.form === 'Sekskant') icon = 'hexagon';

                const qtyColor = m.qty === 0 ? 'text-red' : 'text-f2f3f3';
                const opacity = m.qty === 0 ? 'opacity-50' : 'opacity-100';

                return `
                <div class="border border-line bg-graphite rounded-lg p-2.5 flex gap-3 items-center justify-between transition hover:border-line2 ${opacity}">
                    <div class="flex items-center gap-3 w-full">

                            </div>
                        </div>
                        <div class="flex flex-col items-end gap-1.5 shrink-0">
                            <div class="flex items-center gap-1.5 bg-black border border-line rounded p-0.5">
                                <button class="mat-qty-btn w-6 h-6 rounded bg-surface hover:bg-line2 text-dim flex items-center justify-center transition active:bg-orange" data-id="${m.id}" data-change="-1"><i data-lucide="minus" class="w-3 h-3"></i></button>
                                <span class="text-xs font-mono font-bold ${qtyColor} w-4 text-center">${m.qty}</span>
                                <button class="mat-qty-btn w-6 h-6 rounded bg-surface hover:bg-line2 text-dim flex items-center justify-center transition active:bg-orange" data-id="${m.id}" data-change="1"><i data-lucide="plus" class="w-3 h-3"></i></button>
                            </div>
                            <button class="delete-mat text-[8px] font-mono text-dim hover:text-red transition uppercase tracking-widest" data-id="${m.id}">Slet</button>
                        </div>
                    </div>
                </div>
            `}).join('');
            lucide.createIcons();
        }

        function initMaterials() {
            const matSelect = document.getElementById('mat');
            if(!matSelect) return;
            matSelect.innerHTML = '';
            let currentGroup = '';
            let html = '';
            for (const [key, data] of Object.entries(materialsRaw)) {
                if (data.group !== currentGroup) {
                    if (currentGroup !== '') html += `</optgroup>`;
                    html += `<optgroup label="${data.group}">`;
                    currentGroup = data.group;
                }
                html += `<option value="${key}">${data.name}</option>`;
            }
            html += `</optgroup>`;
            matSelect.innerHTML = html;
            updateUI();
        }

        function markDirty(el) {
            el.dataset.dirty = "true";
            const label = el.parentElement.querySelector('.auto-tag');
            if (label) label.classList.add('hidden');
            document.getElementById('reset-btn').classList.remove('hidden');
        }

        function resetDirty() {
            const fields = ['D', 'Z', 'ae', 'ap', 'L'];
            fields.forEach(id => {
                const el = document.getElementById(id);
                if(el) {
                    el.dataset.dirty = "false";
                    const label = el.parentElement.querySelector('.auto-tag');
                    if (label) label.classList.remove('hidden');
                }
            });
            document.getElementById('reset-btn').classList.add('hidden');
            calc(true); 
        }

        function handleGeometryChange() {
            const geom = document.getElementById('toolGeometry').value;
            const opSelect = document.getElementById('operation');
            
            if (['drill', 'spotdrill', 'tap', 'reamer', 'boringhead'].includes(geom)) {
                opSelect.value = 'bor';
                opSelect.disabled = true;
            } else {
                opSelect.disabled = false;
                if (opSelect.value === 'bor') opSelect.value = 'profil';
            }
            handleOperationChange();
            hardUpdateUI();
        }

        function handleOperationChange() {
            const type = document.getElementById('machine').options[document.getElementById('machine').selectedIndex].dataset.type;
            if (type === 'turn') return;

            const op = document.getElementById('operation').value;
            const aeInput = document.getElementById('ae');
            const apInput = document.getElementById('ap');
            const mrrBlock = document.getElementById('mrr-block');
            const stratGrid = document.getElementById('strategy-grid');
            
            aeInput.readOnly = false;
            aeInput.classList.remove('text-dim', 'border-line2');
            apInput.parentElement.classList.remove('hidden');
            mrrBlock.classList.remove('hidden');
            stratGrid.classList.remove('hidden');

            if (op === 'spor') {
                resetDirty();
                aeInput.readOnly = true;
                aeInput.classList.add('text-dim', 'border-line2');
                calc(true);
            } else if (op === 'bor') {
                aeInput.parentElement.classList.add('hidden');
                apInput.parentElement.classList.add('hidden');
                mrrBlock.classList.add('hidden');
                document.getElementById('strategy').value = 'normal';
                calc(true);
            } else {
                aeInput.parentElement.classList.remove('hidden');
                calc(true);
            }
        }

        function updateUI() {
            const selectMachine = document.getElementById('machine');
            const type = selectMachine.options[selectMachine.selectedIndex].dataset.type;
            const toolSelect = document.getElementById('toolData');
            toolSelect.innerHTML = '';
            
            const cribTools = JSON.parse(localStorage.getItem('datum_tools')) || [];
            const validCribTools = cribTools.filter(t => t.loc && t.name && t.D);

            let filteredCribTools = validCribTools;
            if (type === 'mill') {
                filteredCribTools = validCribTools.filter(t => !t.type.startsWith('turn_'));
            } else if (type === 'turn') {
                filteredCribTools = validCribTools.filter(t => t.type.startsWith('turn_') || ['drill', 'spotdrill', 'tap', 'reamer', 'boringhead'].includes(t.type));
            }

            if (filteredCribTools.length > 0) { 
                toolSelect.innerHTML += `<optgroup label="TOOL CRIB">`;
                filteredCribTools.forEach(t => {
                    const t_mat = t.mat || 'hm';
                    const t_type = t.type || 'endmill';
                    const mods = materialMods[t_mat] || materialMods['hm'];
                    toolSelect.innerHTML += `<option value="crib_${t.id}" data-iscrib="true" data-type="${t_type}" data-vcmod="${mods.vc}" data-fmod="${mods.f}" data-d="${t.D}" data-z="${t.Z}" data-l="${t.L}" data-lc="${t.Lc || t.D*2}">${t.loc} - ${t.name}</option>`;
                });
                toolSelect.innerHTML += `</optgroup>`;
            }

            const availableTools = tools[type];
            toolSelect.innerHTML += `<optgroup label="MANUEL INPUT">`;
            for (const [toolKey, toolData] of Object.entries(availableTools)) {
                const params = type === 'mill' ? `data-z="${toolData.z}"` : '';
                toolSelect.innerHTML += `<option value="${toolKey}" data-iscrib="false" data-type="endmill" data-vcmod="${toolData.vc_mod}" data-fmod="${toolData.f_mod}" ${params}>${toolData.name}</option>`;
            }
            toolSelect.innerHTML += `</optgroup>`;

            toggleMachineType(type);
            handleCribSelection();
        }

        function handleCribSelection() {
            const toolSelect = document.getElementById('toolData');
            if(!toolSelect.options.length) return;
            const optTool = toolSelect.options[toolSelect.selectedIndex];
            const geomSelect = document.getElementById('toolGeometry');

            if (optTool && optTool.dataset.iscrib === "true" && optTool.dataset.type) {
                geomSelect.value = optTool.dataset.type;
                geomSelect.disabled = true; 
                geomSelect.classList.add('text-dim', 'border-line2');
                geomSelect.classList.remove('text-orange', 'border-orange/30');
            } else {
                geomSelect.disabled = false;
                geomSelect.classList.remove('text-dim', 'border-line2');
                geomSelect.classList.add('text-orange', 'border-orange/30');
            }
            handleGeometryChange();
        }

        function hardUpdateUI() { resetDirty(); }
        function softUpdate() { calc(true); }

        function toggleMachineType(type) {
            const elements = {
                labelD: document.getElementById('label-D'),
                contZ: document.getElementById('container-Z'),
                contAe: document.getElementById('container-ae'),
                contAp: document.getElementById('container-ap'),
                contL: document.getElementById('container-L'),
                mrrBlock: document.getElementById('mrr-block'),
                ldBlock: document.getElementById('ld-block'),
                feedLabel: document.getElementById('feed-label'),
                feedUnit: document.getElementById('feed-unit'),
                opSelect: document.getElementById('operation'),
                geomSelect: document.getElementById('toolGeometry')
            };

            if (type === 'turn') {
                elements.labelD.textContent = "Emne Ø (D)";
                ['contZ', 'contAe', 'contAp', 'contL', 'mrrBlock', 'ldBlock'].forEach(k => elements[k].classList.add('hidden'));
                elements.opSelect.innerHTML = `<option value="udv">Udvendig Drejning</option><option value="indv">Indvendig udboring</option>`;
                elements.feedLabel.textContent = "Tilspænding (f)";
                elements.feedUnit.textContent = "mm/omdr";
                elements.geomSelect.parentElement.classList.add('hidden');
            } else {
                elements.labelD.textContent = "Værktøj Ø (D)";
                ['contZ', 'contAe', 'contAp', 'contL', 'mrrBlock', 'ldBlock'].forEach(k => elements[k].classList.remove('hidden'));
                elements.opSelect.innerHTML = `<option value="profil">Side / Profil</option><option value="spor">Sporfræsning</option><option value="bor">Boring (Z-akse)</option>`;
                elements.feedLabel.textContent = "Bordtilspænding (Vf)";
                elements.feedUnit.textContent = "mm/min";
                elements.geomSelect.parentElement.classList.remove('hidden');
            }
        }

        function applySmartDefaults(D, optTool, strat, op, geom) {
            let ae_val = D * strat.ae;
            let ap_val = D * strat.ap;

            if (geom === 'facemill') { ae_val = D * 0.70; ap_val = Math.min(D * 0.1, 3.0); }
            if (geom === 'undercut' || geom === 'slittingsaw') { ae_val = D; ap_val = D * 0.2; }
            if (op === 'spor') { ae_val = D; }

            const isCrib = optTool.dataset.iscrib === "true";
            
            const fields = {
                'D': { val: isCrib ? parseFloat(optTool.dataset.d) : null, force: isCrib },
                'Z': { val: isCrib ? parseFloat(optTool.dataset.z) : (parseFloat(optTool.dataset.z) || 2), force: isCrib },
                'L': { val: isCrib ? parseFloat(optTool.dataset.l) : (D * 3.0), force: isCrib },
                'ae': { val: ae_val, force: false },
                'ap': { val: isCrib && !isNaN(parseFloat(optTool.dataset.lc)) ? Math.min(ap_val, parseFloat(optTool.dataset.lc)) : ap_val, force: false }
            };

            for (const [id, data] of Object.entries(fields)) {
                const el = document.getElementById(id);
                if (el && (el.dataset.dirty !== "true" || data.force) && data.val) {
                    el.value = (id === 'Z' || id === 'D' || id === 'L') && data.force ? data.val : data.val.toFixed(2);
                    if(data.force) el.dataset.dirty = "false"; 
                }
            }
        }

        function generateWarning(text, type) {
            const color = type === 'critical' ? 'bg-red' : 'bg-orange';
            const textColor = type === 'critical' ? 'text-red' : 'text-orange';
            return `<div class="flex items-center gap-1.5 border border-${color}/20 bg-${color}/10 px-2 py-0.5 rounded"><span class="w-1.5 h-1.5 ${color} rounded-full"></span><span class="chip ${textColor} !text-[8px] !m-0">${text}</span></div>`;
        }

        function calc(applyDefaults = false) {
            const selectMachine = document.getElementById('machine');
            if(!selectMachine) return;
            const type = selectMachine.options[selectMachine.selectedIndex].dataset.type;
            const maxRpm = parseFloat(selectMachine.options[selectMachine.selectedIndex].dataset.rpm);
            const hasHSM = selectMachine.value.includes('hsm');

            const matKey = document.getElementById('mat').value;
            const matData = materialsRaw[matKey];

            const toolSelect = document.getElementById('toolData');
            if (!toolSelect.options.length) return;
            const optTool = toolSelect.options[toolSelect.selectedIndex];
            
            const geom = type === 'mill' ? document.getElementById('toolGeometry').value : 'none';
            const stratKey = document.getElementById('strategy').value;
            const strat = strategyMods[stratKey];
            const op = document.getElementById('operation').value;

            let vc_base = matData.vc * parseFloat(optTool.dataset.vcmod) * strat.vc;
            let f_base = matData.f * parseFloat(optTool.dataset.fmod) * strat.fz;

            const warningsDiv = document.getElementById('warnings');
            warningsDiv.innerHTML = ''; 

            if (type === 'mill') {
                if (geom === 'undercut' || geom === 'slittingsaw') { f_base *= 0.4; warningsDiv.innerHTML += generateWarning('UNDERCUT', 'critical'); }
                if (geom === 'chamfer') { f_base *= 0.7; vc_base *= 0.8; }
                if (geom === 'threadmill') { f_base *= 0.5; vc_base *= 0.9; }
                if (op === 'spor') { f_base *= 0.8; }
            }

            let inputD = document.getElementById('D').value;
            if(!inputD && optTool.dataset.iscrib === "true") {
                document.getElementById('D').value = optTool.dataset.d;
                inputD = optTool.dataset.d;
            }
            
            const D = parseFloat(inputD) || 0;
            if (D <= 0) {
                document.getElementById('rpm-out').textContent = "0";
                document.getElementById('vf-out').textContent = "0";
                return;
            }

            if (type === 'mill' && applyDefaults) applySmartDefaults(D, optTool, strat, op, geom);

            let rpm = (vc_base * 1000) / (Math.PI * D);
            if (rpm > maxRpm) {
                rpm = maxRpm;
                warningsDiv.innerHTML += generateWarning('SPINDEL MAX', 'critical');
                document.getElementById('rpm-out').parentElement.classList.replace('text-f2f3f3', 'text-red');
            } else {
                document.getElementById('rpm-out').parentElement.classList.replace('text-red', 'text-f2f3f3');
            }
            document.getElementById('rpm-out').textContent = Math.round(rpm).toLocaleString('da-DK');

            if (type === 'mill') {
                const Z = parseFloat(document.getElementById('Z').value) || 0;
                const ae = (op === 'spor' || geom === 'undercut' || geom === 'slittingsaw') ? D : (parseFloat(document.getElementById('ae').value) || 0);
                const ap = parseFloat(document.getElementById('ap').value) || 0;
                const L = parseFloat(document.getElementById('L').value) || 0;
                
                let fz_comp = f_base;
                
                if (op === 'profil' && !['undercut', 'slittingsaw', 'drill', 'spotdrill', 'tap', 'reamer', 'boringhead'].includes(geom) && ae > 0 && ae < (D / 2)) {
                    const thinningMultiplier = Math.min(Math.sqrt(D / ae), 3.0); 
                    fz_comp = f_base * thinningMultiplier;
                    
                    if(!hasHSM && thinningMultiplier > 1.5) {
                         warningsDiv.innerHTML += generateWarning('INGEN HSM', 'critical');
                    } else if(geom !== 'facemill') {
                         warningsDiv.innerHTML += generateWarning('THINNING', 'normal');
                    }
                }

                const vf = op === 'bor' ? (rpm * f_base) : (rpm * Z * fz_comp);
                document.getElementById('vf-out').textContent = Math.round(vf).toLocaleString('da-DK');
                
                if (op !== 'bor' && ae > 0 && ap > 0) {
                    document.getElementById('mrr-out').textContent = ((ap * ae * vf) / 1000).toFixed(1);
                    
                    const Lc = optTool.dataset.iscrib === "true" && !isNaN(parseFloat(optTool.dataset.lc)) ? parseFloat(optTool.dataset.lc) : D*2;
                    if (ap > Lc) {
                        warningsDiv.innerHTML += generateWarning('AP > Lc', 'critical');
                    }
                }

                if (op !== 'bor' && L > 0) {
                    const ld = L / D;
                    document.getElementById('ld-out').textContent = ld.toFixed(2);
                    if (ld >= 4) {
                        warningsDiv.innerHTML += generateWarning('L/D RATIO', 'critical');
                        document.getElementById('ld-out').parentElement.classList.replace('text-f2f3f3', 'text-red');
                    } else {
                        document.getElementById('ld-out').parentElement.classList.replace('text-red', 'text-f2f3f3');
                    }
                }
            } 
            else if (type === 'turn') {
                document.getElementById('vf-out').textContent = f_base.toFixed(2);
            }
        }

        function calcSop() {
            // Gevind / Forboring
            const thrD = parseFloat(document.getElementById('sop-thr-d')?.value) || 0;
            const thrP = parseFloat(document.getElementById('sop-thr-p')?.value) || 0;
            
            if(thrD > 0 && thrP > 0) {
                document.getElementById('sop-cut-out').textContent = (thrD - thrP).toFixed(2);
                document.getElementById('sop-form-out').textContent = (thrD - (thrP / 2)).toFixed(2);
                document.getElementById('sop-thr-depth').textContent = (thrD * 1.5).toFixed(1);
            } else {
                document.getElementById('sop-cut-out').textContent = "0.00";
                document.getElementById('sop-form-out').textContent = "0.00";
                document.getElementById('sop-thr-depth').textContent = "0.0";
            }

            // Teoretisk Overfladeruhed (Ra og Rz i µm) + N-Skala
            const raRe = parseFloat(document.getElementById('sop-ra-re')?.value) || 0;
            const raF = parseFloat(document.getElementById('sop-ra-f')?.value) || 0;
            
            if(raRe > 0 && raF > 0) {
                const ra = ((raF * raF) / (32 * raRe)) * 1000;
                const rz = ((raF * raF) / (8 * raRe)) * 1000;
                
                document.getElementById('sop-ra-out').textContent = ra.toFixed(2);
                document.getElementById('sop-rz-out').textContent = rz.toFixed(2);
                
                let nScale = "N/A";
                if (ra <= 0.025) nScale = "N1";
                else if (ra <= 0.05) nScale = "N2";
                else if (ra <= 0.1) nScale = "N3";
                else if (ra <= 0.2) nScale = "N4";
                else if (ra <= 0.4) nScale = "N5";
                else if (ra <= 0.8) nScale = "N6";
                else if (ra <= 1.6) nScale = "N7";
                else if (ra <= 3.2) nScale = "N8";
                else if (ra <= 6.3) nScale = "N9";
                else if (ra <= 12.5) nScale = "N10";
                else if (ra <= 25) nScale = "N11";
                else nScale = "N12";
                
                document.getElementById('sop-ra-n').textContent = nScale;
            } else {
                document.getElementById('sop-ra-out').textContent = "0.00";
                document.getElementById('sop-rz-out').textContent = "0.00";
                document.getElementById('sop-ra-n').textContent = "N/A";
            }
            
            // ISO 286 Pasninger & Sigtetal
            const isoD = parseFloat(document.getElementById('sop-iso-d')?.value) || 0;
            const isoClass = document.getElementById('sop-iso-c')?.value.trim();
            
            const upperEl = document.getElementById('sop-iso-upper');
            const lowerEl = document.getElementById('sop-iso-lower');
            const targetEl = document.getElementById('sop-iso-target');
            const minEl = document.getElementById('sop-iso-min');
            const maxEl = document.getElementById('sop-iso-max');

            if (isoD > 0 && isoClass) {
                let rangeIdx = -1;
                for (let i = 0; i < iso286Data.ranges.length; i++) {
                    if (isoD <= iso286Data.ranges[i]) {
                        rangeIdx = i;
                        break;
                    }
                }

                if (rangeIdx !== -1) {
                    const limits = iso286Data.classes[isoClass];
                    if (limits) {
                        const upperDev = limits[rangeIdx][0] / 1000;
                        const lowerDev = limits[rangeIdx][1] / 1000;
                        
                        const maxDim = isoD + upperDev;
                        const minDim = isoD + lowerDev;
                        const targetDim = (maxDim + minDim) / 2;

                        upperEl.textContent = (upperDev > 0 ? '+' : '') + upperDev.toFixed(3);
                        lowerEl.textContent = (lowerDev > 0 ? '+' : '') + lowerDev.toFixed(3);
                        
                        minEl.textContent = minDim.toFixed(3);
                        maxEl.textContent = maxDim.toFixed(3);
                        targetEl.textContent = targetDim.toFixed(4);

                        upperEl.className = "text-orange";
                        lowerEl.className = "text-orange";
                    } else {
                        upperEl.textContent = "N/A";
                        lowerEl.textContent = "N/A";
                        minEl.textContent = "0.000";
                        maxEl.textContent = "0.000";
                        targetEl.textContent = "N/A";
                    }
                } else {
                    targetEl.textContent = ">250";
                }
            } else {
                if(upperEl && lowerEl && targetEl) {
                    upperEl.textContent = "0.000";
                    lowerEl.textContent = "0.000";
                    minEl.textContent = "0.000";
                    maxEl.textContent = "0.000";
                    targetEl.textContent = "0.0000";
                    upperEl.className = "text-dim";
                    lowerEl.className = "text-dim";
                }
            }
        }

        // Boot-sekvens
        document.addEventListener('DOMContentLoaded', () => {
            lucide.createIcons();
            router.navigate('imd'); 
        });
    </script>
