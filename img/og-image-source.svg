<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Datum Prototyping — one-off dele og finmekanik</title>
  <desc id="desc">Mørk teknisk delingsgrafik med Datum Prototyping-logo, bearbejdet emne og teksten Mangler du den ene del?</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#9bacb3" stroke-opacity=".08" stroke-width="1"/>
    </pattern>
    <linearGradient id="field" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080a0b"/>
      <stop offset=".62" stop-color="#0b1114"/>
      <stop offset="1" stop-color="#12242a"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#080a0b"/>
      <stop offset=".22" stop-color="#080a0b" stop-opacity=".9"/>
      <stop offset=".62" stop-color="#080a0b" stop-opacity=".08"/>
      <stop offset="1" stop-color="#080a0b" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ff642e" stop-opacity=".22"/>
      <stop offset="1" stop-color="#ff642e" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="partFrame"><path d="M694 70H1162V560H720L694 534Z"/></clipPath>
  </defs>

  <rect width="1200" height="630" fill="url(#field)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <path d="M0 0h5v154H0z" fill="#ff642e"/>
  <path d="M0 470h5v160H0z" fill="#d8f15b"/>

  <image x="52" y="42" width="520" height="99" href="datum-prototyping-logo.svg" xlink:href="datum-prototyping-logo.svg" preserveAspectRatio="xMinYMin meet"/>

  <text x="60" y="224" fill="#ff642e" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" letter-spacing="3">ONE-OFF · PROTOTYPE · FINMEKANIK</text>
  <text x="58" y="304" fill="#f4f4ef" font-family="Arial, Helvetica, sans-serif" font-size="58" font-weight="700" letter-spacing="-2">Mangler du</text>
  <text x="58" y="368" fill="#f4f4ef" font-family="Arial, Helvetica, sans-serif" font-size="58" font-weight="700" letter-spacing="-2">den ene del?</text>
  <path d="M60 407h64" stroke="#ff642e" stroke-width="4"/>
  <text x="58" y="456" fill="#a2a9ad" font-family="Arial, Helvetica, sans-serif" font-size="22">Fra idé og CAD til den færdige del.</text>

  <g clip-path="url(#partFrame)">
    <rect x="694" y="70" width="468" height="490" fill="#0e1113"/>
    <ellipse cx="930" cy="320" rx="330" ry="290" fill="url(#glow)"/>
    <image x="686" y="88" width="500" height="430" href="tactable.png" xlink:href="tactable.png" preserveAspectRatio="xMidYMid meet"/>
    <rect x="694" y="70" width="300" height="490" fill="url(#fade)"/>
  </g>
  <path d="M694 70h468v490H720l-26-26Z" fill="none" stroke="#3d454a" stroke-width="1"/>
  <path d="M694 70h74M694 70v74M1162 486v74h-74" fill="none" stroke="#ff642e" stroke-width="2"/>
  <circle cx="933" cy="315" r="7" fill="none" stroke="#d8f15b" stroke-width="2"/>
  <path d="M905 315h56M933 287v56" stroke="#d8f15b" stroke-opacity=".58" stroke-width="1"/>
  <text x="709" y="96" fill="#a2a9ad" font-family="Consolas, monospace" font-size="11" font-weight="700" letter-spacing="2">PART / PROCESS / PROOF</text>
  <text x="1138" y="540" fill="#ff642e" font-family="Consolas, monospace" font-size="11" font-weight="700" text-anchor="end" letter-spacing="2">X0 / Y0 / Z0</text>

  <path d="M58 536H642" stroke="#272d31"/>
  <circle cx="65" cy="572" r="5" fill="#d8f15b"/>
  <text x="82" y="578" fill="#f4f4ef" font-family="Consolas, monospace" font-size="17" font-weight="700" letter-spacing="1.5">DATUMPROTOTYPING.DK</text>
  <text x="642" y="578" fill="#70787d" font-family="Consolas, monospace" font-size="12" text-anchor="end" letter-spacing="1.5">KØBENHAVN / DK</text>
</svg>
